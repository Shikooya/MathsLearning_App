// ── Helpers ───────────────────────────────────────────────
function getFactors(n){
  var f=[];
  for(var i=1;i<=Math.sqrt(n)+0.01;i++){
    if(n%i===0){f.push(i);if(i!==n/i)f.push(n/i);}
  }
  return f.sort(function(a,b){return a-b;});
}

function divRule(n,d){
  // Returns a short description of why n is/isn't divisible by d
  switch(d){
    case 2: return (n%2===0?'Even (last digit '+String(n).slice(-1)+')':'Last digit '+String(n).slice(-1)+' is odd');
    case 3: var s=String(n).split('').reduce(function(a,c){return a+parseInt(c);},0);
            return 'Digit sum = '+s+(s%3===0?' (divisible by 3)':' (not divisible by 3)');
    case 4: var lt=n%100; return 'Last two digits = '+lt+(lt%4===0?' (divisible by 4)':' (not)');
    case 5: return (n%5===0?'Ends in '+String(n).slice(-1):'Ends in '+String(n).slice(-1)+', not 0 or 5');
    default: return n%d===0?'Divides exactly':'Does not divide exactly';
  }
}

];

            return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:'+(crossed?'rgba(245,158,11,.08)':'rgba(15,118,110,.06)')+'">'+

        '</div></div>',
      nia:'Once you pass the square root, every new pair is just a repeat of one you have already found. That is why you can stop there.'
    },
  ];

  function show(){
    var sdots=S.map(function(_,i){return '<div class="sdot'+(i===sl?' on':'')+'"></div>';}).join('');

        '</div>')+
      '</div>';

    if(isSlide2){factorStep=0;updateFactor24();}
    var bb=document.getElementById('btnBack');
    if(bb){bb.disabled=(sl===0&&step===1);bb.onclick=function(){if(sl>0){sl--;show();}else{goStep(-1);}};}
  }

  window.s1n=function(){if(sl<S.length-1){sl++;show();}else{goStep(1);}};
  window.s1b=function(){if(sl>0){sl--;show();}else{goStep(-1);}};
  window.factorNext=function(){

  };
  show();
}

// Factor 24 walkthrough data
var F24=[
  {n:1,  divides:true,  rule:'1 divides every number',         pair:[1,24]},
  {n:2,  divides:true,  rule:'Even number (ends in 4)',         pair:[2,12]},
  {n:3,  divides:true,  rule:'Digit sum = 6, divisible by 3',  pair:[3,8]},
  {n:4,  divides:true,  rule:'Last two digits 24 / 4 = 6',     pair:[4,6]},
  {n:5,  divides:false, rule:'Ends in 4, not 0 or 5',          pair:null},
  {n:6,  divides:false, rule:'6 x 4 already found — stop here!',pair:null,stop:true},
];

function buildFactor24(upTo){
  var rows='';
  for(var i=0;i<=Math.min(upTo,F24.length-1);i++){
    var f=F24[i];
    rows+='<div class="test-row">'+
      '<div class="test-n">'+f.n+'</div>'+
      '<div class="test-rule">'+f.rule+'</div>'+
      '<div class="test-result '+(f.divides?'yes':(f.stop?'yes':'no'))+'">'+(f.divides?'&#10003; '+f.pair[0]+' x '+f.pair[1]:(f.stop?'&#9632; Stop':'&#10005;'))+'</div>'+
      '</div>';
  }
  // Show found factors so far
  var found=[];
  for(var j=0;j<=Math.min(upTo,F24.length-1);j++){
    if(F24[j].pair){found.push(F24[j].pair[0]);if(F24[j].pair[1]!==F24[j].pair[0])found.push(F24[j].pair[1]);}
  }
  found.sort(function(a,b){return a-b;});
  var chips=found.length?'<div class="factor-chips">'+found.map(function(f){return '<div class="chip shared">'+f+'</div>';}).join('')+'</div>':'';

  return '<div class="panel-title">Finding all factors of 24</div>'+
    '<div style="margin-bottom:10px">'+rows+'</div>'+
    (chips?'<div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px">Factors found so far:</div>'+chips:'');
}

function updateFactor24(){
  var slide2=document.getElementById('factorSlide2');
  if(slide2) slide2.innerHTML=buildFactor24(factorStep);
  var btn=document.getElementById('factorNextBtn');
  var isDone=(factorStep>=F24.length-1);
  if(btn) btn.textContent=isDone?'Square root insight \u2192':'Next step \u2192';
  var nias=[
    'Starting with 1. Every number is divisible by 1.',
    '2 divides 24 exactly. Factor pair: 2 and 12.',
    '3 divides 24 (digit sum = 6). Factor pair: 3 and 8.',
    '4 divides 24 (last two digits). Factor pair: 4 and 6.',
    '5 does not divide 24 (does not end in 0 or 5).',
    'At 6, the pair 6 x 4 is already recorded. <strong>Stop here.</strong> Factors of 24: 1, 2, 3, 4, 6, 8, 12, 24.',
  ];
  document.getElementById('nia').innerHTML=nias[Math.min(factorStep,nias.length-1)];
}

function pickPuz(idx){
  if(levelAnswered)return;levelAnswered=true;
  var pz=PUZZLES[puzzleLevel];
  var btns=document.querySelectorAll('#popt0,#popt1,#popt2,#popt3');
  btns.forEach(function(b){b.onclick=null;b.style.cursor='default';});
  var chosen=document.getElementById('popt'+idx)?document.getElementById('popt'+idx).getAttribute('data-val'):'';
  var ok=Array.isArray(pz.ans)?pz.ans.indexOf(chosen)>=0:(chosen===pz.ans);
  puzzleResults[puzzleLevel]=ok;
  // Style the chosen and correct buttons
  btns.forEach(function(b){
    var bv=b.getAttribute('data-val');
    var isAns=Array.isArray(pz.ans)?pz.ans.indexOf(bv)>=0:bv===pz.ans;
    if(bv===chosen&&ok){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';b.style.color='#059669';}
    else if(bv===chosen&&!ok){b.style.background='rgba(220,38,38,.08)';b.style.borderColor='#dc2626';b.style.color='#dc2626';}
    else if(isAns){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';}
  });
  var res=document.getElementById('pzRes');
  if(ok){puzzleScore++;if(res){res.textContent='Correct. '+pz.explain;res.className='res ok';}document.getElementById('nia').innerHTML='Correct. '+pz.explain;}
  else{if(res){res.textContent='Not quite. '+pz.explain;res.className='res no';}document.getElementById('nia').innerHTML=pz.explain;}
  puzzleLevel++;
  var isLast=(puzzleLevel>=PUZZLES.length);
  if(ok){
    var _adv=false;

    nxt.onclick=function(){clearTimeout(_t);_doAdv();};

  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';

  var _optsHTML='';
  if(_allShort){
    _optsHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0">';
    _opts.forEach(function(o,i){
      var bg='#ffffff';var bc='#e5e7eb';var tc='#0f1117';
      if(o===h.chosen&&h.wasCorrect){bg='rgba(5,150,105,.12)';bc='#059669';tc='#059669';}
      else if(o===h.chosen&&!h.wasCorrect){bg='rgba(220,38,38,.08)';bc='#dc2626';tc='#dc2626';}
      else if(o===h.correct&&!h.wasCorrect){bg='rgba(5,150,105,.12)';bc='#059669';}
      _optsHTML+='<button disabled style="min-height:80px;border-radius:16px;border:2px solid '+bc+';background:'+bg+';'+
        'display:flex;align-items:center;justify-content:center;'+
        'font-family:DM Serif Display,serif;font-size:36px;color:'+tc+';padding:12px;'+
        'border-left:5px solid '+_TCOLS[i%_TCOLS.length]+'">'+o+'</button>';
    });
    _optsHTML+='</div>';
  } else {
    _optsHTML='<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">';
    _opts.forEach(function(o,i){
      var bg='#ffffff';var bc='#e5e7eb';var tc='#0f1117';var lc=_LCOLS[i%_LCOLS.length];
      if(o===h.chosen&&h.wasCorrect){bg='rgba(5,150,105,.12)';bc='#059669';lc='#059669';tc='#059669';}
      else if(o===h.chosen&&!h.wasCorrect){bg='rgba(220,38,38,.08)';bc='#dc2626';lc='#dc2626';tc='#dc2626';}
      else if(o===h.correct&&!h.wasCorrect){bg='rgba(5,150,105,.12)';bc='#059669';lc='#059669';}
      _optsHTML+='<button disabled style="min-height:54px;border-radius:14px;border:1.5px solid '+bc+';background:'+bg+';'+
        'display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;box-sizing:border-box">'+
        '<div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:'+lc+'">'+_LBLS[i]+'</div>'+
        '<div style="font-size:14px;font-weight:600;color:'+tc+';line-height:1.4;flex:1">'+o+'</div>'+
        '</button>';
    });
    _optsHTML+='</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="panel"><div class="stars">'+stars+'</div>'+
    '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:8px">Question '+(idx+1)+' — reviewed</div>'+
    '<div class="puz-q">'+q.q+'</div>'+
    _optsHTML+
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'+
    '<button onclick="showQPrev('+(idx-1)+')" style="padding:8px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);opacity:'+(idx===0?.3:1)+'" '+(idx===0?'disabled':'')+'>&#8592; Prev</button>'+
    (idx<qIdx-1?'<button onclick="showQPrev('+(idx+1)+')" style="padding:8px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)">Next &#8594;</button>':
     '<button onclick="showQ()" style="padding:8px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer">Continue quiz &#8594;</button>')+
    '</div></div>';
  document.getElementById('nia').innerHTML=(h.wasCorrect?'Correct! ':'Answer was <strong>'+h.correct+'</strong>. ')+'Reviewing question '+(idx+1)+'.';
}

function pickQ(idx){
  var q=QS[qIdx];
  var btns=document.querySelectorAll('#qopt0,#qopt1,#qopt2,#qopt3');
  btns.forEach(function(b){b.onclick=null;b.style.cursor='default';});
  var chosen=document.getElementById('qopt'+idx)?document.getElementById('qopt'+idx).getAttribute('data-val'):'';
  var ok=(chosen===q.ans);
  qHistory[qIdx]={chosen:chosen,correct:q.ans,wasCorrect:ok,score:qScore+(ok?1:0)};
  btns.forEach(function(b){
    var bv=b.getAttribute('data-val');
    if(bv===chosen&&ok){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';b.style.color='#059669';}
    else if(bv===chosen&&!ok){b.style.background='rgba(220,38,38,.08)';b.style.borderColor='#dc2626';b.style.color='#dc2626';}
    else if(bv===q.ans){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';}
  });
  var res=document.getElementById('qRes');
  if(ok){qScore++;if(res){res.textContent='Correct.';res.className='res ok';}document.getElementById('nia').innerHTML='Correct.';}
  else{if(res){res.textContent='Answer: '+q.ans;res.className='res no';}document.getElementById('nia').innerHTML='Answer: <strong>'+q.ans+'</strong>.';}
  qIdx++;
  var isLast=(qIdx>=QS.length);
  if(ok){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQEnd():showQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQEnd():showQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQEnd(){
  var perfect=(qScore===QS.length);if(perfect)burst();
  var stars='';for(var i=0;i<QS.length;i++)stars+='<div class="star'+(i<qScore?' on':'')+'">&#11088;</div>';
  document.getElementById('main').innerHTML=
    '<div class="panel" style="text-align:center;padding:32px 24px">'+
    '<div class="stars" style="margin-bottom:20px">'+stars+'</div>'+
    '<div style="font-family:DM Serif Display,serif;font-size:clamp(22px,5vw,28px);margin-bottom:8px">'+
      (perfect?'Perfect.':qScore>=3?'Almost perfect.':qScore>=2?'Good work.':'Keep going.')+
    '</div>'+
    '<div style="font-size:14px;color:var(--muted);margin-bottom:20px">'+qScore+' of '+QS.length+' correct</div>'+
    '<button onclick="goStep(-4)" style="padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)">Start again</button>'+
    '</div>';
  document.getElementById('nia').innerHTML=(perfect?'<strong>Perfect.</strong> ':'')+'You know the divisibility rules. Next: use them to find factors quickly.';
}

function renderStep3(){puzzleLevel=0;puzzleScore=0;puzzleResults=[];levelAnswered=false;showPuzzle();}







// ── STEP 4: Quiz ──────────────────────────────────────────
function renderStep4(){qIdx=0;qScore=0;qHistory=[];document.getElementById('nia').innerHTML=NIA[4];showQ();}









// ── STEP 5 (index 4): Summary ─────────────────────────────
function renderStep4summary(){
  document.getElementById('main').innerHTML=
    '<div class="panel">'+
    '<div class="panel-title">Finding all factors</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">'+
    ['Start at 1 — always a factor pair with the number itself.',
     'Test each number upward using divisibility rules.',
     'Stop when the pair meets or crosses the square root.',
     'List all factors in order: smallest to largest.'].map(function(t,i){
      return '<div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2)">'+
        '<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">'+(i+1)+'</div>'+
        '<div>'+t+'</div></div>';
    }).join('')+
    '</div>'+
    '<div class="panel-title" style="margin-top:4px">HCF — Highest Common Factor</div>'+
    '<div style="display:flex;flex-direction:column;gap:6px">'+
    ['Find factors of each number separately.',
     'Identify numbers that appear in both lists.',
     'The HCF is the largest of these common factors.',
     'Use HCF to simplify fractions and to factorise algebraic expressions.'].map(function(t,i){
      return '<div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2)">'+
        '<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">'+(i+1)+'</div>'+
        '<div>'+t+'</div></div>';
    }).join('')+
    '</div>'+
    '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2);font-weight:500">'+
      'Next: <strong style="color:var(--ink)">Multiples and LCM</strong> \u2014 the other side of the same relationship.'+
    '</div></div>';
}

var RS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4,renderStep4summary];

function goStep(dir){
  step=Math.max(0,Math.min(5,step+dir));
  var dotStep=Math.min(step,4);
  for(var i=0;i<=4;i++){var d=document.getElementById('d'+i);if(d)d.className='step-dot'+(i<dotStep?' done':i===dotStep?' active':'');}
  document.getElementById('nia').innerHTML=NIA[Math.min(step,NIA.length-1)];
  document.getElementById('btnBack').disabled=(step===0);
  var bl=['Finding factors','Common factors & HCF','Practice','Quiz','Summary','Start again'];
  document.getElementById('btnNext').textContent=(bl[step]||'Next')+' \u2192';
  if(step>=5){document.getElementById('btnNext').onclick=function(){goStep(-5);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  if(step!==2&&step!==3&&step!==4){
    var bb=document.getElementById('btnBack');
    if(bb){bb.disabled=(step===0);bb.onclick=function(){goStep(-1);};}
  }
  if(step===2){
    var bb=document.getElementById('btnBack');
    if(bb){bb.disabled=false;bb.onclick=function(){goStep(-1);};}
  }
  RS[Math.min(step,RS.length-1)]();
}
goStep(0);
</script>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shikooya — Sequencing (Ages 5–8)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
  :root{--txt:#1a1a2e;--panel:rgba(255,255,255,0.95);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,#f3e5f5 0%,#e1bee7 100%);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:16px;}
  .header{text-align:center;margin-bottom:12px;width:100%;max-width:700px;}
  .age-badge{display:inline-block;background:linear-gradient(135deg,#8e24aa,#4a148c);
    color:#fff;font-size:13px;font-weight:900;letter-spacing:.06em;
    text-transform:uppercase;padding:5px 18px;border-radius:20px;margin-bottom:8px;
    box-shadow:0 3px 10px rgba(142,36,170,.35);}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(22px,5vw,32px);
    color:#4a148c;line-height:1.2;}
  .header h1 span{color:#f59e0b;}
  .card{background:var(--panel);border-radius:28px;padding:20px;max-width:700px;width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,.12);border:3px solid rgba(142,36,170,.2);}
  /* Steps — 5 steps = d0..d4 */
  .steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:all .3s;}
  .step-dot.active{background:#f59e0b;transform:scale(1.5);}
  .step-dot.done{background:#8e24aa;}
  /* Nia */
  .nia-area{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;min-height:60px;}
  .nia-avatar{width:52px;height:52px;flex-shrink:0;background:linear-gradient(135deg,#8e24aa,#4a148c);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 4px 12px rgba(142,36,170,.3);animation:bob 2.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .nia-bubble{background:linear-gradient(135deg,#f3e5f5,#ede7f6);border:2.5px solid #ce93d8;
    border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:clamp(14px,3vw,17px);
    font-weight:700;color:var(--txt);line-height:1.6;flex:1;}
  .nia-bubble strong{color:#4a148c;}
  .nia-bubble em{color:#f59e0b;font-style:normal;font-weight:900;}
  /* Preface */
  .preface{background:linear-gradient(135deg,#f3e5f5,#e8f5e9);border-radius:18px;
    padding:16px 18px;margin-bottom:16px;border:2.5px solid #ce93d8;}
  .preface-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
    font-size:clamp(13px,2.5vw,15px);font-weight:700;color:var(--txt);line-height:1.6;}
  .preface-row:last-child{margin-bottom:0;}
  .preface-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
  /* Sequence cards */
  .seq-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .seq-card{background:#fff;border:3px solid #ce93d8;border-radius:16px;
    padding:10px 8px;text-align:center;min-width:clamp(72px,13vw,96px);
    max-width:110px;flex:1;transition:all .2s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;user-select:none;}
  .seq-card:hover{transform:scale(1.06);}
  .seq-card.correct{border-color:#43a047;background:rgba(67,160,71,.08);animation:pop .4s ease;}
  .seq-card.wrong{border-color:#e53935;background:rgba(229,57,53,.06);animation:shake .3s ease;}
  .seq-card.dragging{opacity:.5;transform:scale(.95);}
  .seq-card.dragover{border-color:#f59e0b;background:rgba(245,158,11,.1);transform:scale(1.08);}
  .seq-card.locked{cursor:default;}
  .seq-card.locked:hover{transform:none;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .seq-emoji{font-size:clamp(28px,6vw,40px);line-height:1;margin-bottom:4px;}
  .seq-label{font-family:'Fredoka One',cursive;font-size:clamp(11px,2.5vw,14px);color:#4a148c;}
  .seq-num{font-family:'Fredoka One',cursive;font-size:clamp(18px,4vw,26px);
    width:clamp(32px,6vw,42px);height:clamp(32px,6vw,42px);border-radius:50%;
    background:#ce93d8;color:#fff;display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px;}
  /* Drop zones */
  .drop-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .drop-zone{background:#f3e5f5;border:3px dashed #ce93d8;border-radius:16px;
    padding:10px 8px;text-align:center;min-width:clamp(72px,13vw,96px);max-width:110px;
    flex:1;min-height:clamp(80px,14vw,110px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;transition:all .2s;cursor:pointer;}
  .drop-zone.filled{border-style:solid;border-color:#8e24aa;background:#fff;}
  .drop-zone.dragover{border-color:#f59e0b;background:rgba(245,158,11,.1);}
  .drop-zone-num{font-family:'Fredoka One',cursive;font-size:13px;color:#ce93d8;margin-top:4px;}
  /* Check button */
  .check-btn{display:block;margin:0 auto 10px;padding:12px 28px;border-radius:16px;border:none;
    background:linear-gradient(135deg,#8e24aa,#4a148c);color:#fff;
    font-family:'Fredoka One',cursive;font-size:clamp(15px,3.5vw,19px);
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:all .2s;}
  .check-btn:hover{transform:translateY(-2px);}
  .check-btn:active{transform:translateY(2px);}
  .check-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  /* Level badge */
  .level-badge{display:inline-flex;align-items:center;gap:6px;
    background:rgba(142,36,170,.1);border:2px solid #ce93d8;border-radius:12px;
    padding:5px 14px;font-family:'Fredoka One',cursive;font-size:clamp(13px,3vw,16px);color:#4a148c;}
  .prog-dots{display:flex;gap:6px;}
  .prog-dot{width:12px;height:12px;border-radius:50%;background:#e1bee7;
    border:2px solid #ce93d8;transition:all .3s;}
  .prog-dot.done-p{background:#8e24aa;border-color:#4a148c;}
  .prog-dot.curr-p{background:#f59e0b;border-color:#e65100;transform:scale(1.3);}
  /* Result */
  .result-msg{font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,17px);
    text-align:center;min-height:26px;margin-bottom:8px;}
  .result-msg.ok{color:#2e7d32;}
  .result-msg.no{color:#c62828;}
  /* Quiz */
  .quiz-area{background:linear-gradient(135deg,#f3e5f5,#ede7f6);border-radius:18px;
    padding:16px 18px;margin-bottom:14px;border:2.5px solid #ce93d8;}
  .quiz-q{font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,22px);
    color:var(--txt);margin-bottom:12px;text-align:center;line-height:1.5;}
  .quiz-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .quiz-btn{min-width:80px;min-height:60px;border-radius:14px;border:3px solid #ddd;background:#fff;
    font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,17px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.1);
    color:var(--txt);padding:8px;}
  .quiz-btn:hover{transform:scale(1.08);border-color:#8e24aa;}
  .quiz-btn.correct{background:linear-gradient(135deg,#66bb6a,#43a047);border-color:#2e7d32;color:#fff;animation:pop .4s ease;}
  .quiz-btn.wrong{background:linear-gradient(135deg,#ef9a9a,#e57373);border-color:#c62828;color:#fff;animation:shake .3s ease;}
  .quiz-result{text-align:center;margin-top:10px;font-family:'Fredoka One',cursive;
    font-size:clamp(14px,3.5vw,18px);min-height:26px;}
  .quiz-result.correct{color:#2e7d32;}
  .quiz-result.wrong{color:#c62828;}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:10px;}
  .star{font-size:28px;opacity:.25;transition:all .3s;}
  .star.earned{opacity:1;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  /* Nav */
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
  .btn{min-width:64px;min-height:56px;padding:12px 20px;border-radius:16px;border:none;
    font-family:'Fredoka One',cursive;font-size:clamp(15px,3.5vw,19px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn-next{background:linear-gradient(135deg,#8e24aa,#4a148c);color:#fff;flex:1;max-width:220px;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-back{background:linear-gradient(135deg,#90a4ae,#607d8b);color:#fff;}
  .btn-back:hover{transform:translateY(-2px);}
  .btn-back:disabled{opacity:.3;cursor:not-allowed;transform:none;}
  .confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;overflow:hidden;}
  .confetti-piece{position:absolute;border-radius:2px;animation:confetti-fall 2s ease-in forwards;}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  /* Back to menu button */
  .back-menu{position:fixed;top:12px;left:12px;z-index:200;
    display:flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:20px;border:1.5px solid rgba(79,70,229,.2);
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
    color:#4f46e5;text-decoration:none;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .2s;}
  .back-menu:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<a class="back-menu" href="../../index.html">&#8592; All topics</a>

<div class="header">
  <div><span class="age-badge">Ages 5–8 · Mathematical Thinking</span></div>
  <h1>Put it in <span>Order</span>! — Sequencing 🌱</h1>
</div>
<div class="card">
  <!-- 5 steps = d0..d4 -->
  <div class="steps">
    <div class="step-dot active" id="d0"></div>
    <div class="step-dot" id="d1"></div>
    <div class="step-dot" id="d2"></div>
    <div class="step-dot" id="d3"></div>
    <div class="step-dot" id="d4"></div>
  </div>
  <div class="nia-area">
    <div class="nia-avatar">🌟</div>
    <div class="nia-bubble" id="nia">
      Everything around us has an <strong>order</strong>! Seeds grow into plants, babies grow into adults, morning comes before evening. Putting things in the right order is called <em>sequencing</em>! 🌱
    </div>
  </div>
  <div id="mainArea"></div>
  <div class="controls">
    <button class="btn btn-back" id="btnBack" onclick="goStep(-1)" disabled>← Back</button>
    <button class="btn btn-next" id="btnNext" onclick="goStep(1)">Let's go! →</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>

<script>
var currentStep=0,puzzleScore=0, seqLevel=0, quizIdx=0, quizCorrect=0;

// ── Sequencing levels ─────────────────────────────────────
// Each level has items in CORRECT order — we shuffle them for the puzzle
var LEVELS = [
  {
    label:'Level 1 — Growing a Plant',
    items:[
      {emoji:'🌱',label:'Seed'},
      {emoji:'🌿',label:'Sprout'},
      {emoji:'🌳',label:'Sapling'},
      {emoji:'🎋',label:'Full tree'},
    ],
    explain:'A plant grows from a tiny seed → sprout → sapling → full tree! This always happens in this order.',
  },
  {
    label:'Level 2 — Making a Sandwich',
    items:[
      {emoji:'🍞',label:'Get bread'},
      {emoji:'🧈',label:'Spread butter'},
      {emoji:'🥬',label:'Add filling'},
      {emoji:'🥪',label:'Close it up'},
    ],
    explain:'To make a sandwich you always get bread first, then spread, then filling, then close it! Steps must be in order.',
  },
  {
    label:'Level 3 — The Day',
    items:[
      {emoji:'🌅',label:'Morning'},
      {emoji:'☀️',label:'Daytime'},
      {emoji:'🌇',label:'Evening'},
      {emoji:'🌙',label:'Night'},
    ],
    explain:'Every day follows the same sequence: morning → daytime → evening → night. It always repeats!',
  },
  {
    label:'Level 4 — Numbers 1 to 5',
    items:[
      {emoji:'1️⃣',label:'One'},
      {emoji:'2️⃣',label:'Two'},
      {emoji:'3️⃣',label:'Three'},
      {emoji:'4️⃣',label:'Four'},
      {emoji:'5️⃣',label:'Five'},
    ],
    explain:'Numbers always follow the same sequence — each one is exactly one more than the last!',
  },
  {
    label:'Level 5 — Seasons',
    items:[
      {emoji:'🌸',label:'Spring'},
      {emoji:'☀️',label:'Summer'},
      {emoji:'🍂',label:'Autumn'},
      {emoji:'❄️',label:'Winter'},
    ],
    explain:'The seasons always follow the same order: spring → summer → autumn → winter — then back to spring!',
  },
];

// Current shuffled order for the puzzle
var currentOrder = [];
var dropSlots = [];

// ── Quiz questions ─────────────────────────────────────────
var QUIZ_QS = [
  {q:'What comes AFTER a sprout when a plant grows?',
   opts:['Seed','Sapling','Full tree','Flower'], answer:'Sapling'},
  {q:'When making a sandwich, what do you do FIRST?',
   opts:['Add filling','Spread butter','Close it','Get bread'], answer:'Get bread'},
  {q:'What comes after EVENING in the day?',
   opts:['Morning','Daytime','Night','Noon'], answer:'Night'},
  {q:'What does sequencing mean?',
   opts:['Adding numbers','Putting things in the right order','Drawing shapes','Counting backwards'],
   answer:'Putting things in the right order'},
];

// ── Helpers ───────────────────────────────────────────────
function dots(s){
  for(var i=0;i<=4;i++){
    var d=document.getElementById('d'+i);
    if(d) d.className='step-dot'+(i<s?' done':i===s?' active':'');
  }
}
function confettiBurst(){
  var c=document.getElementById('confetti');c.innerHTML='';
  var cols=['#ffe066','#8e24aa','#f44336','#43a047','#f59e0b','#0288d1'];
  for(var i=0;i<52;i++){
    var p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+
      ';width:'+(8+Math.random()*8)+'px;height:'+(8+Math.random()*8)+'px;'+
      'border-radius:'+(Math.random()>.5?'50%':'2px')+';'+
      'animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.5+Math.random())+'s';
    c.appendChild(p);
  }
  setTimeout(function(){c.innerHTML='';},3000);
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

// ── STEP 0 — Preface ──────────────────────────────────────
function renderStep0(){
  // Show the plant growth sequence as a visual demo
  var demoItems=[
    {emoji:'🌱',label:'1. Seed'},
    {emoji:'🌿',label:'2. Sprout'},
    {emoji:'🌳',label:'3. Sapling'},
    {emoji:'🎋',label:'4. Tree'},
  ];
  var demoHtml=demoItems.map(function(it,i){
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:60px">'+
      '<div style="font-size:clamp(32px,7vw,48px)">'+it.emoji+'</div>'+
      '<div style="font-family:Fredoka One,cursive;font-size:clamp(11px,2.5vw,14px);color:#4a148c">'+it.label+'</div>'+
      (i<3?'':'');
  }).join('<div style="font-size:22px;color:#ce93d8;align-self:center;flex-shrink:0">→</div>');

  document.getElementById('mainArea').innerHTML=
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">📘</div><div><strong>What you will learn:</strong> What a sequence is — things that must happen in a specific order — and how to arrange them correctly.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🌍</div><div><strong>Why it matters:</strong> Sequences are everywhere! Recipes, instructions, days of the week, numbers, seasons — they all follow a fixed order. Understanding sequences is essential for maths, science and everyday life.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🎯</div><div><strong>By the end:</strong> You will be able to arrange pictures and events in the correct order and explain why the order matters!</div></div>'+
    '</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,16px);color:#4a148c;text-align:center;margin-bottom:10px">A sequence — things in the right order:</div>'+
    '<div style="display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.85);border:2.5px solid #ce93d8;border-radius:18px;padding:14px">'+
    demoHtml+
    '</div>';
}

// ── STEP 1 — Sequencing puzzles ───────────────────────────
function renderStep1(){
  puzzleScore=0;
  seqLevel=0;
  showSeqLevel();
}

function showSeqLevel(){
  if(seqLevel>=LEVELS.length){showSeqDone();return;}
  var lv=LEVELS[seqLevel];
  // Shuffle items
  currentOrder=shuffle(lv.items.map(function(it,i){return {idx:i,emoji:it.emoji,label:it.label};}));
  dropSlots=new Array(lv.items.length).fill(null);
  buildSeqPuzzle(false);
}

function buildSeqPuzzle(checked){
  var lv=LEVELS[seqLevel];
  var prog='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">'+
    '<div class="level-badge">🌱 '+lv.label+'</div>'+
    '<div class="prog-dots">';
  for(var i=0;i<LEVELS.length;i++)
    prog+='<div class="prog-dot'+(i<seqLevel?' done-p':i===seqLevel?' curr-p':'')+'" ></div>';
  prog+='</div></div>';

  // Source cards — items not yet placed
  var placed=dropSlots.filter(function(s){return s!==null;}).map(function(s){return s.idx;});
  var sourceHtml='<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#4a148c;text-align:center;margin-bottom:6px">Tap an item below, then tap a numbered slot above to place it!</div>'+
    '<div class="seq-row">';
  currentOrder.forEach(function(it){
    var isPlaced=placed.indexOf(it.idx)>=0;
    if(!isPlaced){
      sourceHtml+='<div class="seq-card" id="src_'+it.idx+'" onclick="selectItem('+it.idx+')">'+
        '<div class="seq-emoji">'+it.emoji+'</div>'+
        '<div class="seq-label">'+it.label+'</div></div>';
    }
  });
  sourceHtml+='</div>';

  // Drop slots
  var slotHtml='<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#4a148c;text-align:center;margin-bottom:6px">Put them in the right order — slot 1 goes first!</div>'+
    '<div class="drop-row">';
  for(var s=0;s<lv.items.length;s++){
    var slotContent=dropSlots[s];
    var slotClass='drop-zone'+(slotContent?' filled':'');
    var correctness='';
    if(checked&&slotContent){
      correctness=slotContent.idx===s?' correct':' wrong';
    }
    slotHtml+='<div class="'+slotClass+correctness+'" id="slot_'+s+'" onclick="placeInSlot('+s+')">';
    if(slotContent){
      slotHtml+='<div class="seq-emoji">'+slotContent.emoji+'</div>'+
        '<div class="seq-label">'+slotContent.label+'</div>';
    } else {
      slotHtml+='<div style="font-size:28px;color:#d1a3e0">?</div>';
    }
    slotHtml+='<div class="drop-zone-num">'+(s+1)+'</div></div>';
  }
  slotHtml+='</div>';

  var allFilled=dropSlots.filter(function(s){return s!==null;}).length===lv.items.length;
  var checkHtml='<button class="check-btn" onclick="checkSequence()" '+(allFilled?'':'disabled')+'>'+
    (allFilled?'✅ Check my order!':'Fill all slots first!')+
    '</button>';
  var resetHtml='<div style="text-align:center;margin-bottom:8px">'+
    '<button onclick="resetLevel()" style="padding:6px 16px;border-radius:10px;border:2px solid #ce93d8;background:#fff;font-family:Fredoka One,cursive;font-size:14px;cursor:pointer;color:#4a148c">🔄 Reset</button></div>';
  var resultHtml='<div class="result-msg" id="seqResult"></div>';

  document.getElementById('mainArea').innerHTML=prog+slotHtml+sourceHtml+resetHtml+checkHtml+resultHtml;
}

var selectedItemIdx=-1;

function selectItem(idx){
  // Highlight selected
  document.querySelectorAll('.seq-card').forEach(function(el){
    el.style.border='3px solid #ce93d8';
    el.style.background='#fff';
  });
  var el=document.getElementById('src_'+idx);
  if(el){el.style.border='3px solid #8e24aa';el.style.background='rgba(142,36,170,.08)';}
  selectedItemIdx=idx;
  document.getElementById('nia').innerHTML='Good choice! Now tap a numbered slot to place <strong>'+LEVELS[seqLevel].items[idx].label+'</strong> there!';
}

function placeInSlot(slotIdx){
  if(selectedItemIdx<0){
    document.getElementById('nia').innerHTML='👆 First tap an item from below — then tap a slot to place it!';
    return;
  }
  // If slot already filled — swap back to source
  if(dropSlots[slotIdx]!==null){
    var old=dropSlots[slotIdx];
    dropSlots[slotIdx]=null;
    // Put it back (it will appear in source again)
  }
  var lv=LEVELS[seqLevel];
  dropSlots[slotIdx]={idx:selectedItemIdx,emoji:lv.items[selectedItemIdx].emoji,label:lv.items[selectedItemIdx].label};
  selectedItemIdx=-1;
  buildSeqPuzzle(false);
}

function resetLevel(){
  dropSlots=new Array(LEVELS[seqLevel].items.length).fill(null);
  selectedItemIdx=-1;
  buildSeqPuzzle(false);
  document.getElementById('nia').innerHTML=NIA[1];
}

function checkSequence(){
  var lv=LEVELS[seqLevel];
  var allCorrect=true;
  for(var i=0;i<lv.items.length;i++){
    if(!dropSlots[i]||dropSlots[i].idx!==i){allCorrect=false;break;}
  }
  buildSeqPuzzle(true);
  var res=document.getElementById('seqResult');
  if(allCorrect){puzzleScore++;
    if(res){res.textContent='✅ Perfect order! '+lv.explain;res.className='result-msg ok';}
    document.getElementById('nia').innerHTML='✅ <strong>Perfect!</strong> '+lv.explain;
    if(seqLevel===LEVELS.length-1)confettiBurst();
    setTimeout(function(){seqLevel++;showSeqLevel();},2200);
  } else {
    if(res){res.textContent='💛 Not quite right! Think about what happens first, second, third...';res.className='result-msg no';}
    document.getElementById('nia').innerHTML='💛 Not quite! Think carefully — what must happen <em>first</em>?';
    setTimeout(function(){resetLevel();},1800);
  }
}

function showSeqDone(){
  if(puzzleScore>=LEVELS.length)confettiBurst();
  document.getElementById('mainArea').innerHTML=
    '<div style="text-align:center;padding:16px 0">'+
    '<div style="font-size:64px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(18px,4vw,26px);color:#4a148c;margin-top:10px">All 5 sequences complete!</div>'+
    '<div style="font-size:clamp(13px,3vw,16px);font-weight:700;color:#555;margin-top:8px">You are a sequencing superstar! 🌱</div>'+
    '</div>';
  document.getElementById('nia').innerHTML='🏆 You put every sequence in the correct order! You understand that <strong>order matters</strong>!';
}

// ── STEP 2 — Make your own sequence ───────────────────────
var mySeq=[];
var MY_ITEMS=[
  {emoji:'🌞',label:'Wake up'},{emoji:'🪥',label:'Brush teeth'},
  {emoji:'🍳',label:'Eat breakfast'},{emoji:'👕',label:'Get dressed'},
  {emoji:'🎒',label:'Pack bag'},{emoji:'🚶',label:'Go to school'},
];

function renderStep2(){
  mySeq=[];
  buildMySeq();
}

function buildMySeq(){
  var itemsHtml='<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#4a148c;text-align:center;margin-bottom:8px">Tap the steps in the right order for your morning routine!</div>'+
    '<div class="seq-row">';
  MY_ITEMS.forEach(function(it,i){
    var pos=mySeq.indexOf(i);
    var isSelected=pos>=0;
    itemsHtml+='<div class="seq-card'+(isSelected?' locked':'')+'" onclick="'+(isSelected?'':'addToMySeq('+i+')')+'">'+
      (isSelected?'<div class="seq-num">'+(pos+1)+'</div>':'')+
      '<div class="seq-emoji">'+it.emoji+'</div>'+
      '<div class="seq-label">'+it.label+'</div></div>';
  });
  itemsHtml+='</div>';

  // Show current sequence
  var seqDisplay='';
  if(mySeq.length>0){
    seqDisplay='<div style="background:rgba(255,255,255,.85);border:2.5px solid #ce93d8;border-radius:16px;padding:12px;margin-bottom:10px">'+
      '<div style="font-family:Fredoka One,cursive;font-size:13px;color:#4a148c;margin-bottom:8px;text-align:center">Your morning order:</div>'+
      '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center">';
    mySeq.forEach(function(idx,pos){
      var it=MY_ITEMS[idx];
      seqDisplay+='<div style="text-align:center;font-size:clamp(22px,5vw,32px)">'+it.emoji+'</div>';
      if(pos<mySeq.length-1)seqDisplay+='<div style="font-size:18px;color:#ce93d8">→</div>';
    });
    seqDisplay+='</div></div>';
  }

  var allDone=mySeq.length===MY_ITEMS.length;
  var doneBtnHtml='';
  if(allDone){
    doneBtnHtml='<div style="text-align:center;background:rgba(67,160,71,.1);border:2.5px solid #81c784;border-radius:14px;padding:10px 14px;margin-bottom:8px">'+
      '<div style="font-family:Fredoka One,cursive;font-size:clamp(15px,3.5vw,19px);color:#2e7d32">🎉 Your morning routine is ready!</div></div>';
  }
  var resetBtn='<div style="text-align:center;margin-bottom:8px">'+
    '<button onclick="resetMySeq()" style="padding:6px 16px;border-radius:10px;border:2px solid #ce93d8;background:#fff;font-family:Fredoka One,cursive;font-size:14px;cursor:pointer;color:#4a148c">🔄 Start again</button></div>';

  document.getElementById('mainArea').innerHTML=seqDisplay+doneBtnHtml+itemsHtml+resetBtn;
}

function addToMySeq(idx){
  if(mySeq.indexOf(idx)>=0)return;
  mySeq.push(idx);
  buildMySeq();
  var it=MY_ITEMS[idx];
  document.getElementById('nia').innerHTML='<strong>'+it.label+'</strong> added as step <em>'+(mySeq.length)+'</em>! '+(mySeq.length<MY_ITEMS.length?'What comes next?':'That is your complete morning routine!');
}
function resetMySeq(){mySeq=[];buildMySeq();document.getElementById('nia').innerHTML=NIA[2];}

// ── STEP 3 — Quiz ─────────────────────────────────────────
function renderStep3(){quizIdx=0;quizCorrect=0;showQuizQ();}

function showQuizQ(){
  if(quizIdx>=QUIZ_QS.length){showQuizEnd();return;}
  var q=QUIZ_QS[quizIdx];
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var opts='';
  q.opts.forEach(function(o){
    opts+='<button class="quiz-btn" onclick="answerQ(\''+o.replace(/'/g,"\\'")+'\',\''+q.answer.replace(/'/g,"\\'")+'\')">'+o+'</button>';
  });
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div class="quiz-area">'+
    '<div class="quiz-q">'+q.q+'</div>'+
    '<div class="quiz-options">'+opts+'</div>'+
    '<div class="quiz-result" id="qRes"></div>'+
    '</div>';
}

function answerQ(chosen,correct){
  var btns=document.querySelectorAll('.quiz-btn,.opt,.ans-tile,.ans-row');
  btns.forEach(function(b){b.onclick=null;b.style.cursor='default';if(b.disabled!==undefined)b.disabled=true;});
  var res=document.getElementById('qRes')||document.getElementById('pzRes')||document.getElementById('quizResult');
  if(chosen===correct){

    btns.forEach(function(b){if(b.textContent.trim()===correct)b.className='quiz-btn correct';});
    quizCorrect++;
    if(res){res.textContent='✅ Correct!';res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='✅ <strong>Correct!</strong> Great sequencing! 🌱';
  
  } else {

    btns.forEach(function(b){
      if(b.textContent.trim()===chosen)b.className='quiz-btn wrong';
      if(b.textContent.trim()===correct)b.className='quiz-btn correct';
    });
    if(res){res.textContent='❌ The answer is: '+correct;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='💛 The answer is <strong>'+correct+'</strong>!';
  
  }
  quizIdx++;
  var isLast=(quizIdx>=QUIZ_QS.length);
  if(chosen===correct){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQuizEnd():showQuizQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQuizEnd():showQuizQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQuizEnd(){
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var msg=quizCorrect===4?'🏆 PERFECT! You are a sequencing expert!':
          quizCorrect>=3?'🌟 Brilliant! Almost perfect!':
          quizCorrect>=2?'👍 Good work! Keep going!':'💪 Keep practising!';
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div style="text-align:center;padding:16px;background:linear-gradient(135deg,#f3e5f5,#ede7f6);border-radius:18px;border:2.5px solid #ce93d8">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#4a148c;margin-bottom:8px">'+msg+'</div>'+
    '<div style="font-size:clamp(14px,3vw,17px);font-weight:700;color:#555">You got <strong style="color:#e53935">'+quizCorrect+'</strong> out of <strong>4</strong> correct!</div>'+
    '</div>';
  if(quizCorrect>=3)confettiBurst();
  document.getElementById('nia').innerHTML=quizCorrect===4?
    '🏆 <strong>Perfect!</strong> You can put anything in the right order! 🌱':
    '🌟 Well done! A sequence is a fixed order that things must follow!';
}

// ── STEP 4 — Summary ──────────────────────────────────────
function renderStep4(){
  var examples=[
    {title:'Growing a plant',items:['🌱','🌿','🌳','🎋']},
    {title:'The day',items:['🌅','☀️','🌇','🌙']},
    {title:'The seasons',items:['🌸','☀️','🍂','❄️']},
    {title:'Numbers',items:['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣']},
  ];
  var exHtml=examples.map(function(ex){
    return '<div style="background:rgba(255,255,255,.85);border:2px solid #ce93d8;border-radius:14px;padding:10px 12px;flex:1;min-width:140px">'+
      '<div style="font-family:Fredoka One,cursive;font-size:clamp(12px,2.5vw,14px);color:#4a148c;margin-bottom:8px;text-align:center">'+ex.title+'</div>'+
      '<div style="display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap">'+
      ex.items.map(function(e,i){return '<span style="font-size:clamp(18px,4vw,26px)">'+e+'</span>'+(i<ex.items.length-1?'<span style="font-size:14px;color:#ce93d8">→</span>':'');}).join('')+
      '</div></div>';
  }).join('');

  document.getElementById('mainArea').innerHTML=
    '<div style="text-align:center;padding:8px 0 14px">'+
    '<div style="font-size:56px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#4a148c;margin-top:8px;margin-bottom:14px">You understand sequencing!</div>'+
    '</div>'+
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>A <strong>sequence</strong> is things arranged in a fixed order — each step follows the one before it.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>Sequences are everywhere — <strong>numbers, seasons, recipes, days</strong> — they all follow a fixed order.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div><strong>Order matters!</strong> You cannot close a sandwich before you add the filling — steps must happen in the right sequence.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🚀</div><div>Next — we will move to <strong>Ages 8–10</strong>: Decimals, Percentages and more!</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+exHtml+'</div>';
  confettiBurst();
}

// ── Navigation ────────────────────────────────────────────
var NIA=[
  "Everything around us has an <strong>order</strong>! Seeds grow into plants, babies grow into adults, morning comes before evening. Putting things in the right order is called <em>sequencing</em>! 🌱",
  "Each puzzle has items that go in a specific order. <strong>Tap an item</strong> below, then <strong>tap a numbered slot</strong> above to place it! When all slots are filled, check your answer!",
  "Now build your own! Tap each step of a morning routine <strong>in the right order</strong> — what do you do first thing when you wake up? 🌞",
  "Quiz time! 🌟 Show what you know about putting things in order!",
  "Amazing! 🏆 You understand sequences — one of the most important ideas in all of mathematics!"
];
var BTNS=[
  "Start puzzles! →",
  "Build your routine! →",
  "Quiz time! →",
  "See the summary! →",
  "🔁 Play Again!"
];
var RENDERS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4];

function goStep(dir){
  currentStep=Math.max(0,Math.min(4,currentStep+dir));
  dots(currentStep);
  document.getElementById('nia').innerHTML=NIA[currentStep];
  document.getElementById('btnBack').disabled=(currentStep===0);
  document.getElementById('btnNext').textContent=BTNS[currentStep];
  document.getElementById('btnNext').disabled=false;
  if(currentStep===4){document.getElementById('btnNext').onclick=function(){goStep(-4);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  RENDERS[currentStep]();
}
goStep(0);
</script>

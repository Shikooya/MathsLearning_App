<title>Shikooya — Spatial Reasoning (Ages 5–8)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
  :root{--txt:#1a1a2e;--panel:rgba(255,255,255,0.95);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#e0f7fa 0%,#b2ebf2 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
  .header{text-align:center;margin-bottom:12px;width:100%;max-width:720px;}
  .age-badge{display:inline-block;background:linear-gradient(135deg,#0288d1,#01579b);color:#fff;font-size:13px;font-weight:900;
    letter-spacing:.06em;text-transform:uppercase;padding:5px 18px;border-radius:20px;margin-bottom:8px;box-shadow:0 3px 10px rgba(2,136,209,.35);}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(22px,5vw,32px);color:#01579b;line-height:1.2;}
  .header h1 span{color:#f59e0b;}
  .card{background:var(--panel);border-radius:28px;padding:20px;max-width:720px;width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,.12);border:3px solid rgba(2,136,209,.2);}
  .steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:all .3s;}
  .step-dot.active{background:#f59e0b;transform:scale(1.5);}
  .step-dot.done{background:#0288d1;}
  .nia-area{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;min-height:60px;}
  .nia-avatar{width:52px;height:52px;flex-shrink:0;background:linear-gradient(135deg,#0288d1,#01579b);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(2,136,209,.3);
    animation:bob 2.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .nia-bubble{background:linear-gradient(135deg,#e0f7fa,#e3f2fd);border:2.5px solid #81d4fa;
    border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:clamp(14px,3vw,17px);font-weight:700;
    color:var(--txt);line-height:1.6;flex:1;}
  .nia-bubble strong{color:#01579b;}
  .nia-bubble em{color:#f59e0b;font-style:normal;font-weight:900;}
  .preface{background:linear-gradient(135deg,#e0f7fa,#e8f5e9);border-radius:18px;padding:16px 18px;
    margin-bottom:16px;border:2.5px solid #81d4fa;}
  .preface-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
    font-size:clamp(13px,2.5vw,15px);font-weight:700;color:var(--txt);line-height:1.6;}
  .preface-row:last-child{margin-bottom:0;}
  .preface-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
  .obj-card{background:rgba(255,255,255,.9);border:2.5px solid #81d4fa;border-radius:18px;
    padding:12px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;
    gap:8px;flex:1;min-width:120px;max-width:160px;cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);}
  .obj-card:hover{transform:scale(1.04);}
  .obj-card.matched{border-color:#43a047;background:rgba(67,160,71,.08);animation:pop .4s ease;}
  .obj-card.wrong-flash{animation:shake .3s ease;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .obj-name{font-family:'Fredoka One',cursive;font-size:clamp(13px,3vw,16px);color:#01579b;}
  .level-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(2,136,209,.1);
    border:2px solid #81d4fa;border-radius:12px;padding:5px 14px;
    font-family:'Fredoka One',cursive;font-size:clamp(13px,3vw,16px);color:#01579b;}
  .prog-dots{display:flex;gap:6px;}
  .prog-dot{width:12px;height:12px;border-radius:50%;background:#e0f7fa;border:2px solid #81d4fa;transition:all .3s;}
  .prog-dot.done-p{background:#0288d1;border-color:#01579b;}
  .prog-dot.curr-p{background:#f59e0b;border-color:#e65100;transform:scale(1.3);}
  .result-msg{font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,17px);text-align:center;min-height:28px;margin-top:8px;}
  .result-msg.ok{color:#2e7d32;}
  .result-msg.no{color:#c62828;}
  .face-card{background:rgba(255,255,255,.9);border:2.5px solid #81d4fa;border-radius:16px;
    padding:10px 14px;text-align:center;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);min-width:100px;}
  .face-card:hover{transform:scale(1.06);}
  .face-card.active-face{border-color:#f59e0b;background:rgba(245,158,11,.1);}
  .face-name{font-family:'Fredoka One',cursive;font-size:clamp(12px,2.5vw,14px);color:#01579b;margin-top:6px;}
  .quiz-area{background:linear-gradient(135deg,#e0f7fa,#e3f2fd);border-radius:18px;padding:16px 18px;
    margin-bottom:14px;border:2.5px solid #81d4fa;}
  .quiz-q{font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,22px);color:var(--txt);
    margin-bottom:12px;text-align:center;line-height:1.5;}
  .quiz-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .quiz-btn{min-width:90px;min-height:60px;border-radius:14px;border:3px solid #ddd;background:#fff;
    font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,17px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.1);color:var(--txt);padding:8px;}
  .quiz-btn:hover{transform:scale(1.08);border-color:#0288d1;}
  .quiz-btn.correct{background:linear-gradient(135deg,#66bb6a,#43a047);border-color:#2e7d32;color:#fff;animation:pop .4s ease;}
  .quiz-btn.wrong{background:linear-gradient(135deg,#ef9a9a,#e57373);border-color:#c62828;color:#fff;animation:shake .3s ease;}
  .quiz-result{text-align:center;margin-top:10px;font-family:'Fredoka One',cursive;font-size:clamp(14px,3.5vw,18px);min-height:26px;}
  .quiz-result.correct{color:#2e7d32;}
  .quiz-result.wrong{color:#c62828;}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:10px;}
  .star{font-size:28px;opacity:.25;transition:all .3s;}
  .star.earned{opacity:1;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
  .btn{min-width:64px;min-height:56px;padding:12px 20px;border-radius:16px;border:none;
    font-family:'Fredoka One',cursive;font-size:clamp(15px,3.5vw,19px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn-next{background:linear-gradient(135deg,#0288d1,#01579b);color:#fff;flex:1;max-width:220px;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-back{background:linear-gradient(135deg,#90a4ae,#607d8b);color:#fff;}
  .btn-back:hover{transform:translateY(-2px);}
  .btn-back:disabled{opacity:.3;cursor:not-allowed;transform:none;}
  .confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;overflow:hidden;}
  .confetti-piece{position:absolute;border-radius:2px;animation:confetti-fall 2s ease-in forwards;}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  /* Back to menu button */
  .back-menu{position:fixed;top:12px;left:12px;z-index:200;
    display:flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:20px;border:1.5px solid rgba(79,70,229,.2);
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
    color:#4f46e5;text-decoration:none;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .2s;}
  .back-menu:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>

<div class="header">
  <div><span class="age-badge">Ages 5–8 · Mathematical Thinking</span></div>
  <h1>What Shape Do You <span>See</span>? 🔍</h1>
</div>
<div class="card">
  <div class="steps">
    <div class="step-dot active" id="d0"></div>
    <div class="step-dot" id="d1"></div>
    <div class="step-dot" id="d2"></div>
    <div class="step-dot" id="d3"></div>
    <div class="step-dot" id="d4"></div>
  </div>
  <div class="nia-area">
    <div class="nia-avatar">🌟</div>
    <div class="nia-bubble" id="nia">Every 3D object has a <strong>flat shape hiding inside it</strong>! A tin can looks like a circle from above, but a rectangle from the side. Let us discover the hidden shapes! 🔍</div>
  </div>
  <div id="mainArea"></div>
  <div class="controls">
    <button class="btn btn-back" id="btnBack" onclick="goStep(-1)" disabled>← Back</button>
    <button class="btn btn-next" id="btnNext" onclick="goStep(1)">Let's explore! →</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>
<script>
var currentStep=0,puzzleScore=0,matchLevel=0,quizIdx=0,quizCorrect=0,faceSelected=0,levelAnswered=false;

function sw(c,w,h){return '<svg viewBox="0 0 '+(w||120)+' '+(h||120)+'" width="'+(w||100)+'" height="'+(h||100)+'" xmlns="http://www.w3.org/2000/svg">'+c+'</svg>';}

function drawTinCan(){return sw('<ellipse cx="60" cy="22" rx="38" ry="14" fill="#90a4ae" stroke="#546e7a" stroke-width="2"/><rect x="22" y="22" width="76" height="76" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/><ellipse cx="60" cy="98" rx="38" ry="14" fill="#78909c" stroke="#546e7a" stroke-width="2"/><rect x="22" y="22" width="76" height="10" fill="#cfd8dc"/><text x="60" y="65" text-anchor="middle" font-size="11" fill="#546e7a" font-family="Nunito,sans-serif" font-weight="700">TIN CAN</text>');}
function drawBall(){return sw('<circle cx="60" cy="60" r="48" fill="#ef5350" stroke="#c62828" stroke-width="2"/><ellipse cx="60" cy="60" rx="48" ry="16" fill="none" stroke="#c62828" stroke-width="1.5" opacity="0.5"/><path d="M12,60 Q60,20 108,60" fill="none" stroke="#c62828" stroke-width="1.5" opacity="0.5"/><ellipse cx="42" cy="42" rx="12" ry="8" fill="rgba(255,255,255,0.3)"/>');}
function drawGiftBox(){return sw('<rect x="14" y="42" width="92" height="68" fill="#7c5cfc" stroke="#4a148c" stroke-width="2" rx="3"/><rect x="14" y="28" width="92" height="20" fill="#9c27b0" stroke="#4a148c" stroke-width="2" rx="3"/><rect x="54" y="28" width="12" height="82" fill="#f48fb1" stroke="#c2185b" stroke-width="1"/><line x1="14" y1="60" x2="106" y2="60" stroke="#f48fb1" stroke-width="10" opacity="0.5"/><ellipse cx="60" cy="28" rx="14" ry="8" fill="#f48fb1" stroke="#c2185b" stroke-width="1.5"/>');}
function drawCone(){return sw('<polygon points="60,108 18,40 102,40" fill="#d4a373" stroke="#8d6e63" stroke-width="2"/><line x1="30" y1="60" x2="90" y2="60" stroke="#bcaaa4" stroke-width="1.5" opacity="0.6"/><line x1="60" y1="40" x2="40" y2="100" stroke="#bcaaa4" stroke-width="1.5" opacity="0.6"/><line x1="60" y1="40" x2="80" y2="100" stroke="#bcaaa4" stroke-width="1.5" opacity="0.6"/><circle cx="60" cy="30" r="30" fill="#f8bbd0" stroke="#f48fb1" stroke-width="2"/><circle cx="50" cy="24" r="8" fill="#f06292" opacity="0.5"/>',120,120);}
function drawDice(){return sw('<rect x="20" y="20" width="70" height="70" fill="#fff9c4" stroke="#f9a825" stroke-width="3" rx="8"/><polygon points="20,20 90,20 106,4 36,4" fill="#fff176" stroke="#f9a825" stroke-width="2"/><polygon points="90,20 90,90 106,74 106,4" fill="#ffe082" stroke="#f9a825" stroke-width="2"/><circle cx="40" cy="40" r="6" fill="#f9a825"/><circle cx="70" cy="40" r="6" fill="#f9a825"/><circle cx="55" cy="55" r="6" fill="#f9a825"/><circle cx="40" cy="70" r="6" fill="#f9a825"/><circle cx="70" cy="70" r="6" fill="#f9a825"/>',120,120);}
function diceFront(){return sw('<rect x="15" y="15" width="90" height="90" fill="#fff9c4" stroke="#f9a825" stroke-width="3" rx="8"/><circle cx="35" cy="35" r="7" fill="#f9a825"/><circle cx="85" cy="35" r="7" fill="#f9a825"/><circle cx="60" cy="60" r="7" fill="#f9a825"/><circle cx="35" cy="85" r="7" fill="#f9a825"/><circle cx="85" cy="85" r="7" fill="#f9a825"/>',120,120);}
function diceTop(){return sw('<rect x="15" y="15" width="90" height="90" fill="#ffe082" stroke="#f9a825" stroke-width="3" rx="8"/><circle cx="35" cy="35" r="7" fill="#f9a825"/><circle cx="85" cy="35" r="7" fill="#f9a825"/><circle cx="35" cy="85" r="7" fill="#f9a825"/><circle cx="85" cy="85" r="7" fill="#f9a825"/>',120,120);}

function flatCircle(col){return sw('<circle cx="50" cy="50" r="40" fill="'+(col||'#90a4ae')+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>',100,100);}
function flatRect(col){return sw('<rect x="22" y="8" width="56" height="84" rx="5" fill="'+(col||'#90a4ae')+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>',100,100);}
function flatSquare(col){return sw('<rect x="10" y="10" width="80" height="80" rx="5" fill="'+(col||'#7c5cfc')+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>',100,100);}
function flatTriangle(col){return sw('<polygon points="50,8 92,92 8,92" fill="'+(col||'#d4a373')+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>',100,100);}
function flatDiamond(col){return sw('<polygon points="50,8 92,50 50,92 8,50" fill="'+(col||'#fff176')+'" stroke="rgba(0,0,0,.15)" stroke-width="2"/>',100,100);}

var MATCH_LEVELS=[
  {label:'Level 1',question:'Which object looks like a RECTANGLE from the side?',flatSvg:flatRect('#90a4ae'),flatName:'Rectangle',
   objects:[{name:'Tin Can',svg:drawTinCan(),id:'can'},{name:'Ball',svg:drawBall(),id:'ball'},{name:'Gift Box',svg:drawGiftBox(),id:'gift'}],
   correctId:'can',explain:'A tin can from the side shows its tall rectangular body! The circular top and bottom are hidden.'},
  {label:'Level 2',question:'Which object looks like a CIRCLE from above?',flatSvg:flatCircle('#90a4ae'),flatName:'Circle',
   objects:[{name:'Gift Box',svg:drawGiftBox(),id:'gift'},{name:'Tin Can',svg:drawTinCan(),id:'can'},{name:'Ice Cream Cone',svg:drawCone(),id:'cone'}],
   correctId:'can',explain:'Looking down at a tin can from above, you see its circular top! The tall sides are hidden.'},
  {label:'Level 3',question:'Which object looks like a SQUARE from the front?',flatSvg:flatSquare('#7c5cfc'),flatName:'Square',
   objects:[{name:'Tin Can',svg:drawTinCan(),id:'can'},{name:'Ball',svg:drawBall(),id:'ball'},{name:'Gift Box',svg:drawGiftBox(),id:'gift'}],
   correctId:'gift',explain:'A gift box has flat square faces — from the front you see a flat square!'},
  {label:'Level 4',question:'Which object looks like a TRIANGLE from the side?',flatSvg:flatTriangle('#d4a373'),flatName:'Triangle',
   objects:[{name:'Ball',svg:drawBall(),id:'ball'},{name:'Tin Can',svg:drawTinCan(),id:'can'},{name:'Ice Cream Cone',svg:drawCone(),id:'cone'}],
   correctId:'cone',explain:'An ice cream cone from the side has a triangular outline — wide at the top, pointing at the bottom!'},
  {label:'Level 5',question:'Which object looks like a CIRCLE from ANY direction?',flatSvg:flatCircle('#ef5350'),flatName:'Circle',
   objects:[{name:'Gift Box',svg:drawGiftBox(),id:'gift'},{name:'Ball',svg:drawBall(),id:'ball'},{name:'Ice Cream Cone',svg:drawCone(),id:'cone'}],
   correctId:'ball',explain:'A ball looks like a circle from every direction — front, top, side, anywhere! It is perfectly round.'},
];

var DICE_FACES=[
  {label:'Front face',icon:'👁️ →',desc:'Looking straight at the front — you see a SQUARE! All four sides equal.',shapeSvg:flatSquare('#fff9c4'),shapeName:'Square',objSvg:diceFront()},
  {label:'Top face',icon:'👁️ ↓',desc:'Looking down from above — still a SQUARE! A dice has square faces on all six sides.',shapeSvg:flatSquare('#ffe082'),shapeName:'Square',objSvg:diceTop()},
];

var QUIZ_QS=[
  {q:'A tin can from the SIDE looks like which flat shape?',opts:['Circle','Rectangle','Triangle','Square'],answer:'Rectangle'},
  {q:'A ball looks like a circle from which directions?',opts:['Only from above','Only from the front','Every direction','Only from the side'],answer:'Every direction'},
  {q:'An ice cream cone from the side looks like which shape?',opts:['Square','Circle','Rectangle','Triangle'],answer:'Triangle'},
  {q:'A gift box from the front looks like which shape?',opts:['Circle','Triangle','Square','Oval'],answer:'Square'},
];

var NIA=[
  "Every 3D object has a <strong>flat shape hiding inside it</strong>! A tin can looks like a circle from above, but a rectangle from the side. Let us discover the hidden shapes! 🔍",
  "Look at the <strong>flat shape</strong> shown in the yellow box — then tap the object that would look like that from that direction! 🔍",
  "The <strong>same dice</strong> — three different views! Tap each direction to see how the same object looks different depending on where you look from! 🎲",
  "Quiz time! 🌟 Show off what you have discovered about hidden shapes!",
  "Amazing! 🏆 You can see the flat shape hiding inside every 3D object!"
];
var BTNS=["Start matching! →","Explore the dice! →","Quiz time! →","See the summary! →","🔁 Play Again!"];
var RENDERS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4];

function dots(s){for(var i=0;i<=4;i++){var d=document.getElementById('d'+i);if(d)d.className='step-dot'+(i<s?' done':i===s?' active':'');}}

function confettiBurst(){
  var c=document.getElementById('confetti');c.innerHTML='';
  var cols=['#ffe066','#0288d1','#f44336','#43a047','#f59e0b','#9c27b0'];
  for(var i=0;i<52;i++){var p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+
    ';width:'+(8+Math.random()*8)+'px;height:'+(8+Math.random()*8)+'px;border-radius:'+(Math.random()>.5?'50%':'2px')+
    ';animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.5+Math.random())+'s';c.appendChild(p);}
  setTimeout(function(){c.innerHTML='';},3000);
}

function renderStep0(){
  var pairs=[
    {obj:drawTinCan(),nm:'Tin Can',flat:flatRect('#90a4ae'),fn:'Rectangle (side view)'},
    {obj:drawBall(),nm:'Ball',flat:flatCircle('#ef5350'),fn:'Circle (any direction)'},
    {obj:drawGiftBox(),nm:'Gift Box',flat:flatSquare('#7c5cfc'),fn:'Square (front view)'},
    {obj:drawCone(),nm:'Ice Cream Cone',flat:flatTriangle('#d4a373'),fn:'Triangle (side view)'},
  ];
  var ph=pairs.map(function(p){
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.85);border:2px solid #81d4fa;border-radius:14px;padding:10px 10px;min-width:110px;flex:1;max-width:150px">'+
      p.obj+'<div style="font-family:Fredoka One,cursive;font-size:12px;color:#01579b">'+p.nm+'</div>'+
      '<div style="font-size:18px;color:#81d4fa">↓</div>'+p.flat+
      '<div style="font-family:Fredoka One,cursive;font-size:10px;color:#555;text-align:center">'+p.fn+'</div></div>';
  }).join('');
  document.getElementById('mainArea').innerHTML=
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">📘</div><div><strong>What you will learn:</strong> Every 3D object has a flat shape hiding inside it — the shape you see when you look straight at it.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🌍</div><div><strong>Why it matters:</strong> Architects, engineers and designers think about shapes from different directions every day — it is one of the most useful thinking skills in maths and science!</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🎯</div><div><strong>By the end:</strong> You will be able to look at everyday objects and know what flat shape they show from different directions!</div></div>'+
    '</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#01579b;text-align:center;margin-bottom:10px">Every object hides a flat shape inside it! ↓</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+ph+'</div>';
}

function renderStep1(){
  puzzleScore=0;matchLevel=0;levelAnswered=false;showMatchLevel();}

function showMatchLevel(){
  if(matchLevel>=MATCH_LEVELS.length){showMatchDone();return;}
  var lv=MATCH_LEVELS[matchLevel];levelAnswered=false;
  var prog='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px"><div class="level-badge">🔍 '+lv.label+' of '+MATCH_LEVELS.length+'</div><div class="prog-dots">';
  for(var i=0;i<MATCH_LEVELS.length;i++) prog+='<div class="prog-dot'+(i<matchLevel?' done-p':i===matchLevel?' curr-p':'')+'" ></div>';
  prog+='</div></div>';
  var flatBox='<div style="display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(255,255,255,.9);border:3px solid #f59e0b;border-radius:16px;padding:12px 16px;margin-bottom:14px">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,16px);color:#e65100">'+lv.question+'</div>'+
    lv.flatSvg+'<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,18px);color:#f59e0b">'+lv.flatName+'</div></div>';
  var objs='<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:10px">';
  lv.objects.forEach(function(obj){
    objs+='<div class="obj-card" id="obj_'+obj.id+'" onclick="pickObject(\''+obj.id+'\',\''+lv.correctId+'\')">'+obj.svg+'<div class="obj-name">'+obj.name+'</div></div>';
  });
  objs+='</div>';
  document.getElementById('mainArea').innerHTML=prog+flatBox+objs+'<div class="result-msg" id="resMsg"></div>';
}

function pickObject(chosen,correct){
  if(levelAnswered)return;levelAnswered=true;
  var lv=MATCH_LEVELS[matchLevel];
  var ce=document.getElementById('obj_'+chosen),re=document.getElementById('obj_'+correct);
  var res=document.getElementById('resMsg');
  if(chosen===correct){puzzleScore++;
    if(ce)ce.className='obj-card matched';
    if(res){res.textContent='✅ Correct! '+lv.explain;res.className='result-msg ok';}
    document.getElementById('nia').innerHTML='✅ <strong>Correct!</strong> '+lv.explain;
    if(matchLevel===MATCH_LEVELS.length-1)confettiBurst();
    setTimeout(function(){matchLevel++;showMatchLevel();},2000);
  } else {
    if(ce)ce.className='obj-card wrong-flash';
    if(re)setTimeout(function(){if(re)re.className='obj-card matched';},400);
    if(res){res.textContent='💛 Not quite! '+lv.explain;res.className='result-msg no';}
    document.getElementById('nia').innerHTML='💛 '+lv.explain;
    var _nxtW=document.createElement('button');_nxtW.textContent='Next \u2192';_nxtW.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';_nxtW.onclick=function(){matchLevel++;showMatchLevel();};var _rW=document.getElementById('quizResult')||document.getElementById('qResult')||document.getElementById('puzResult')||document.getElementById('pzRes')||document.getElementById('qRes');if(_rW&&_rW.parentNode)_rW.parentNode.appendChild(_nxtW);
  }
}

function showMatchDone(){
  if(puzzleScore>=MATCH_LEVELS.length)confettiBurst();
  document.getElementById('mainArea').innerHTML='<div style="text-align:center;padding:16px 0"><div style="font-size:64px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(18px,4vw,26px);color:#01579b;margin-top:10px">All 5 matched!</div>'+
    '<div style="font-size:clamp(13px,3vw,16px);font-weight:700;color:#555;margin-top:8px">Your spatial thinking is brilliant! 🔍</div></div>';
  document.getElementById('nia').innerHTML='🏆 You matched every object to its flat shape! Your brain is already thinking in <strong>3D</strong>!';
}

function renderStep2(){faceSelected=0;buildFaceExplorer();}

function buildFaceExplorer(){
  var face=DICE_FACES[faceSelected];
  var tabs='<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:12px">';
  DICE_FACES.forEach(function(f,i){
    tabs+='<div class="face-card'+(i===faceSelected?' active-face':'')+'" onclick="selectFace('+i+')">'+
      '<div style="font-size:26px">'+f.icon+'</div><div class="face-name">'+f.label+'</div></div>';
  });
  tabs+='</div>';
  document.getElementById('mainArea').innerHTML=
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,17px);color:#01579b;text-align:center;margin-bottom:10px">'+
    '🎲 The SAME dice — three different views! Tap each to explore.</div>'+tabs+
    '<div style="display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#e3f2fd,#e0f7fa);border-radius:18px;border:3px solid #81d4fa;padding:16px;margin-bottom:10px">'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div style="font-family:Fredoka One,cursive;font-size:13px;color:#01579b">The dice</div>'+face.objSvg+'</div>'+
    '<div style="font-size:28px;color:#0288d1">→</div>'+
    '<div style="display:flex;flex-direction:column;align-items:center;gap:4px">'+
    '<div style="font-family:Fredoka One,cursive;font-size:13px;color:#01579b">Flat shape you see:</div>'+
    face.shapeSvg+'<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,18px);color:#f59e0b">'+face.shapeName+'</div></div></div>'+
    '<div style="background:rgba(255,255,255,.85);border:2px solid #81d4fa;border-radius:12px;padding:10px 14px;font-size:clamp(13px,2.5vw,15px);font-weight:700;color:#01579b;text-align:center">💡 '+face.desc+'</div>';
}

function selectFace(idx){
  faceSelected=idx;buildFaceExplorer();
  document.getElementById('nia').innerHTML=
    idx===0?'From the <strong>front</strong> — a dice shows a <em>square</em> face! All four sides equal.':
    idx===1?'From the <strong>corner</strong> — the outline looks like a diamond! Same dice, different view.':
    'From <strong>above</strong> — still a square! A dice has square faces on all six sides.';
}

function renderStep3(){quizIdx=0;quizCorrect=0;showQuizQ();}

function showQuizQ(){
  if(quizIdx>=QUIZ_QS.length){showQuizEnd();return;}
  var q=QUIZ_QS[quizIdx];
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var opts='';q.opts.forEach(function(o){opts+='<button class="quiz-btn" onclick="answerQ(\''+o.replace(/'/g,"\\'")+'\',\''+q.answer.replace(/'/g,"\\'")+'\')">'+o+'</button>';});
  document.getElementById('mainArea').innerHTML='<div class="stars">'+stars+'</div><div class="quiz-area"><div class="quiz-q">'+q.q+'</div><div class="quiz-options">'+opts+'</div><div class="quiz-result" id="qRes"></div></div>';
}

function answerQ(chosen,correct){
  var btns=document.querySelectorAll('.quiz-btn');btns.forEach(function(b){b.disabled=true;});
  var res=document.getElementById('qRes');
  if(chosen===correct){
    btns.forEach(function(b){if(b.textContent.trim()===correct)b.className='quiz-btn correct';});
    quizCorrect++;if(res){res.textContent='✅ Correct!';res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='✅ <strong>Correct!</strong> Great spatial thinking! 🔍';
  } else {
    btns.forEach(function(b){if(b.textContent.trim()===chosen)b.className='quiz-btn wrong';if(b.textContent.trim()===correct)b.className='quiz-btn correct';});
    if(res){res.textContent='❌ The answer is: '+correct;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='💛 The answer is <strong>'+correct+'</strong>!';
  }
  quizIdx++;
  if(chosen===correct){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;_doAdv();}
    var _t=setTimeout(_doAdv,1500);
    var nxtOk=document.createElement('button');
    nxtOk.textContent='Next \u2192';
    nxtOk.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxtOk.onclick=function(){clearTimeout(_t);_doAdv();};
    var _r=document.getElementById('quizResult')||document.getElementById('qResult')||document.getElementById('qRes');
    if(_r&&_r.parentNode)_r.parentNode.appendChild(nxtOk);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent='Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){_doAdv();};
    var _r2=document.getElementById('quizResult')||document.getElementById('qResult')||document.getElementById('qRes');
    if(_r2&&_r2.parentNode)_r2.parentNode.appendChild(nxt2);
  }
  var nxt=document.createElement('button');
  nxt.textContent=isLast?'See results →':'Next →';
  nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 24px;border-radius:10px;border:none;background:#4f46e5;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
  nxt.onclick=function(){clearTimeout(_t);_doAdv();};
  var qRes2=document.getElementById('qRes');
  if(qRes2&&qRes2.parentNode) qRes2.parentNode.appendChild(nxt);
}

function showQuizEnd(){
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var msg=quizCorrect===4?'🏆 PERFECT! You are a spatial thinking star!':quizCorrect>=3?'🌟 Brilliant!':quizCorrect>=2?'👍 Good thinking!':'💪 Keep looking!';
  document.getElementById('mainArea').innerHTML='<div class="stars">'+stars+'</div>'+
    '<div style="text-align:center;padding:16px;background:linear-gradient(135deg,#e0f7fa,#e3f2fd);border-radius:18px;border:2.5px solid #81d4fa">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#01579b;margin-bottom:8px">'+msg+'</div>'+
    '<div style="font-size:clamp(14px,3vw,17px);font-weight:700;color:#555">You got <strong style="color:#e53935">'+quizCorrect+'</strong> out of <strong>4</strong> correct!</div></div>';
  if(quizCorrect>=3)confettiBurst();
  document.getElementById('nia').innerHTML=quizCorrect===4?'🏆 <strong>Perfect!</strong> You know what flat shape every object hides! 🔍':'🌟 Well done! Every 3D object has a flat shape hiding inside it!';

  // Start again button
  var sa=document.createElement('button');
  sa.textContent='Start again';
  sa.style.cssText='display:block;margin:16px auto 0;padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)';
  sa.onclick=function(){goStep(-4);};
  var _ep=document.getElementById('mainArea')||document.getElementById('main');
  if(_ep) _ep.appendChild(sa);
}

function renderStep4(){
  var pairs=[
    {obj:drawTinCan(),nm:'Tin Can',flat:flatRect('#90a4ae'),fn:'Rectangle (side)'},
    {obj:drawBall(),nm:'Ball',flat:flatCircle('#ef5350'),fn:'Circle (any direction)'},
    {obj:drawGiftBox(),nm:'Gift Box',flat:flatSquare('#7c5cfc'),fn:'Square (front)'},
    {obj:drawCone(),nm:'Ice Cream Cone',flat:flatTriangle('#d4a373'),fn:'Triangle (side)'},
  ];
  var ph=pairs.map(function(p){
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.85);border:2px solid #81d4fa;border-radius:14px;padding:10px 10px;min-width:110px;flex:1;max-width:150px">'+
      p.obj+'<div style="font-family:Fredoka One,cursive;font-size:12px;color:#01579b">'+p.nm+'</div>'+
      '<div style="font-size:16px;color:#81d4fa">↓</div>'+p.flat+
      '<div style="font-family:Fredoka One,cursive;font-size:10px;color:#555;text-align:center">'+p.fn+'</div></div>';
  }).join('');
  document.getElementById('mainArea').innerHTML=
    '<div style="text-align:center;padding:8px 0 14px"><div style="font-size:56px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#01579b;margin-top:8px;margin-bottom:14px">You can see the hidden shapes!</div></div>'+
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>Every 3D object has a <strong>flat shape</strong> hiding inside it — the shape you see when you look straight at it.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>The <strong>same object</strong> shows different flat shapes from different directions — a tin can is a rectangle from the side but a circle from above!</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>A <strong>ball</strong> is special — it looks like a circle from every direction!</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🚀</div><div>Next — we will explore <strong>sequencing</strong>: putting things in the right order!</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+ph+'</div>';
  confettiBurst();
}

function goStep(dir){
  currentStep=Math.max(0,Math.min(4,currentStep+dir));
  dots(currentStep);
  document.getElementById('nia').innerHTML=NIA[currentStep];
  document.getElementById('btnBack').disabled=(currentStep===0);
  document.getElementById('btnNext').textContent=BTNS[currentStep];
  document.getElementById('btnNext').disabled=false;
  if(currentStep===4){document.getElementById('btnNext').onclick=function(){goStep(-4);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  RENDERS[currentStep]();
}
goStep(0);
</script>
</body>
</html>

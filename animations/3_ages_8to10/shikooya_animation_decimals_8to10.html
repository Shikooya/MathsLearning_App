<head>

<title>Shikooya — Decimals (Ages 8–10)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
  :root{--txt:#1a1a2e;--panel:rgba(255,255,255,0.95);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,#e8f5e9 0%,#c8e6c9 100%);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:16px;}
  .header{text-align:center;margin-bottom:12px;width:100%;max-width:700px;}
  .age-badge{display:inline-block;background:linear-gradient(135deg,#2e7d32,#1b5e20);
    color:#fff;font-size:13px;font-weight:900;letter-spacing:.06em;
    text-transform:uppercase;padding:5px 18px;border-radius:20px;margin-bottom:8px;
    box-shadow:0 3px 10px rgba(46,125,50,.35);}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(22px,5vw,32px);
    color:#1b5e20;line-height:1.2;}
  .header h1 span{color:#f59e0b;}
  .card{background:var(--panel);border-radius:28px;padding:20px;max-width:700px;width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,.12);border:3px solid rgba(46,125,50,.2);}
  .steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:all .3s;}
  .step-dot.active{background:#f59e0b;transform:scale(1.5);}
  .step-dot.done{background:#2e7d32;}
  .nia-area{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;min-height:60px;}
  .nia-avatar{width:52px;height:52px;flex-shrink:0;background:linear-gradient(135deg,#2e7d32,#1b5e20);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 4px 12px rgba(46,125,50,.3);animation:bob 2.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .nia-bubble{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border:2.5px solid #a5d6a7;
    border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:clamp(14px,3vw,17px);
    font-weight:700;color:var(--txt);line-height:1.6;flex:1;}
  .nia-bubble strong{color:#1b5e20;}
  .nia-bubble em{color:#f59e0b;font-style:normal;font-weight:900;}
  .preface{background:linear-gradient(135deg,#e8f5e9,#f9fbe7);border-radius:18px;
    padding:16px 18px;margin-bottom:16px;border:2.5px solid #a5d6a7;}
  .preface-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
    font-size:clamp(13px,2.5vw,15px);font-weight:700;color:var(--txt);line-height:1.6;}
  .preface-row:last-child{margin-bottom:0;}
  .preface-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
  /* Number line */
  .numline-wrap{background:linear-gradient(135deg,#e8f5e9,#f1f8e9);border-radius:18px;
    border:2.5px solid #a5d6a7;padding:16px;margin-bottom:12px;overflow-x:auto;}
  /* Place value grid */
  .pv-grid{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .pv-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:clamp(52px,10vw,72px);}
  .pv-header{font-family:'Fredoka One',cursive;font-size:clamp(11px,2.5vw,14px);
    color:#1b5e20;background:rgba(46,125,50,.1);border:2px solid #a5d6a7;
    border-radius:8px;padding:4px 6px;text-align:center;width:100%;}
  .pv-val{font-family:'Fredoka One',cursive;font-size:clamp(22px,5vw,32px);
    color:var(--txt);border:3px solid #a5d6a7;border-radius:10px;
    width:100%;text-align:center;padding:6px 2px;background:#fff;
    transition:all .2s;}
  .pv-val.highlight{border-color:#f59e0b;background:rgba(245,158,11,.1);}
  .pv-dot{font-family:'Fredoka One',cursive;font-size:clamp(28px,6vw,40px);
    color:#e53935;font-weight:900;align-self:flex-end;padding-bottom:8px;}
  /* Slider */
  .slider-section{margin-bottom:14px;}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:10px;
    border-radius:5px;background:#c8e6c9;outline:none;cursor:pointer;
    touch-action:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;
    border-radius:50%;background:#2e7d32;border:3px solid #fff;cursor:grab;
    box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .1s;}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.2);}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;
    background:#2e7d32;border:3px solid #fff;cursor:grab;
    box-shadow:0 2px 8px rgba(0,0,0,.25);}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#c8e6c9;}
  .big-decimal{font-family:'Fredoka One',cursive;font-size:clamp(36px,8vw,56px);
    color:#1b5e20;text-align:center;margin:8px 0;line-height:1;}
  .big-decimal .dec-point{color:#e53935;}
  /* Shopping scene */
  .shop-scene{background:linear-gradient(135deg,#e8f5e9,#fff9c4);border-radius:18px;
    border:2.5px solid #a5d6a7;padding:14px;margin-bottom:12px;}
  .shop-items{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;}
  .shop-item{background:#fff;border:2.5px solid #a5d6a7;border-radius:14px;
    padding:10px 12px;text-align:center;min-width:90px;cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);}
  .shop-item:hover{transform:scale(1.06);}
  .shop-item.in-basket{border-color:#2e7d32;background:rgba(46,125,50,.08);}
  .shop-item-emoji{font-size:clamp(28px,6vw,36px);}
  .shop-item-name{font-family:'Fredoka One',cursive;font-size:clamp(11px,2.5vw,13px);color:#1b5e20;margin-top:2px;}
  .shop-item-price{font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,18px);color:#e53935;}
  .basket-total{background:#1b5e20;color:#fff;border-radius:12px;padding:10px 16px;
    text-align:center;font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,22px);}
  /* Quiz */
  .quiz-area{background:linear-gradient(135deg,#e8f5e9,#f9fbe7);border-radius:18px;
    padding:16px 18px;margin-bottom:14px;border:2.5px solid #a5d6a7;}
  .quiz-q{font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,22px);
    color:var(--txt);margin-bottom:12px;text-align:center;line-height:1.5;}
  .quiz-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .quiz-btn{min-width:90px;min-height:60px;border-radius:14px;border:3px solid #ddd;background:#fff;
    font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,18px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.1);
    color:var(--txt);padding:8px;}
  .quiz-btn:hover{transform:scale(1.08);border-color:#2e7d32;}
  .quiz-btn.correct{background:linear-gradient(135deg,#66bb6a,#43a047);border-color:#2e7d32;color:#fff;animation:pop .4s ease;}
  .quiz-btn.wrong{background:linear-gradient(135deg,#ef9a9a,#e57373);border-color:#c62828;color:#fff;animation:shake .3s ease;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .quiz-result{text-align:center;margin-top:10px;font-family:'Fredoka One',cursive;
    font-size:clamp(14px,3.5vw,18px);min-height:26px;}
  .quiz-result.correct{color:#2e7d32;}
  .quiz-result.wrong{color:#c62828;}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:10px;}
  .star{font-size:28px;opacity:.25;transition:all .3s;}
  .star.earned{opacity:1;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
  .btn{min-width:64px;min-height:56px;padding:12px 20px;border-radius:16px;border:none;
    font-family:'Fredoka One',cursive;font-size:clamp(15px,3.5vw,19px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn-next{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;flex:1;max-width:220px;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-back{background:linear-gradient(135deg,#90a4ae,#607d8b);color:#fff;}
  .btn-back:hover{transform:translateY(-2px);}
  .btn-back:disabled{opacity:.3;cursor:not-allowed;transform:none;}
  .confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;overflow:hidden;}
  .confetti-piece{position:absolute;border-radius:2px;animation:confetti-fall 2s ease-in forwards;}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  /* Back to menu button */
  .back-menu{position:fixed;top:12px;left:12px;z-index:200;
    display:flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:20px;border:1.5px solid rgba(79,70,229,.2);
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
    color:#4f46e5;text-decoration:none;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .2s;}
  .back-menu:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<a class="back-menu" href="../../index.html">&#8592; All topics</a>

<div class="header">
  <div><span class="age-badge">Ages 8–10</span></div>
  <h1>The <span>Decimal</span> Market 🛒</h1>
</div>
<div class="card">
  <!-- 5 steps = d0..d4 -->
  <div class="steps">
    <div class="step-dot active" id="d0"></div>
    <div class="step-dot" id="d1"></div>
    <div class="step-dot" id="d2"></div>
    <div class="step-dot" id="d3"></div>
    <div class="step-dot" id="d4"></div>
  </div>
  <div class="nia-area">
    <div class="nia-avatar">🌟</div>
    <div class="nia-bubble" id="nia">
      Every time you see a price tag — £1.49, £3.75, £0.99 — you are looking at a <strong>decimal number</strong>! The dot in the middle is not just punctuation — it is one of the most important symbols in maths! 💰
    </div>
  </div>
  <div id="mainArea"></div>
  <div class="controls">
    <button class="btn btn-back" id="btnBack" onclick="goStep(-1)" disabled>← Back</button>
    <button class="btn btn-next" id="btnNext" onclick="goStep(1)">Let's go! →</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>

<script>
var currentStep=0, quizIdx=0, quizCorrect=0;
var sliderVal=123; // represents 1.23
var basketItems=[];

// ── Shop items ─────────────────────────────────────────────
var SHOP=[
  {name:'Apple',emoji:'🍎',price:0.49,pence:49},
  {name:'Bread',emoji:'🍞',price:1.20,pence:120},
  {name:'Milk',emoji:'🥛',price:0.85,pence:85},
  {name:'Cheese',emoji:'🧀',price:2.15,pence:215},
  {name:'Orange',emoji:'🍊',price:0.35,pence:35},
  {name:'Yoghurt',emoji:'🫙',price:1.50,pence:150},
];

// ── Quiz ───────────────────────────────────────────────────
var QUIZ_QS=[
  {q:'What does the decimal point separate?',
   opts:['Hundreds and tens','Ones and tenths','Tens and ones','Nothing'],
   answer:'Ones and tenths'},
  {q:'Which is bigger: 0.7 or 0.35?',
   opts:['0.35','0.7','They are equal','Cannot tell'],
   answer:'0.7'},
  {q:'How many pence is £1.45?',
   opts:['14 pence','1045 pence','145 pence','45 pence'],
   answer:'145 pence'},
  {q:'In the number 2.47, which digit is in the tenths place?',
   opts:['2','4','7','47'],
   answer:'4'},
];

var NIA=[
  "Every time you see a price tag — £1.49, £3.75, £0.99 — you are looking at a <strong>decimal number</strong>! The dot in the middle is not just punctuation — it is one of the most important symbols in maths! 💰",
  "The decimal point separates <strong>whole numbers</strong> on the left from <strong>parts of a number</strong> on the right. Use the slider to explore how decimals work! 🔢",
  "Let us go shopping! Tap items to add them to your basket — and watch the <strong>decimal total</strong> update! Adding decimals is exactly like adding money! 🛒",
  "Quiz time! 🌟 Show what you know about decimals!",
  "Brilliant! 🏆 You understand decimals — the numbers behind every price, every measurement, every score!"
];
var BTNS=[
  "Explore place value! →",
  "Go shopping! →",
  "Quiz time! →",
  "See the summary! →",
  "🔁 Play Again!"
];
var RENDERS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4];

function dots(s){
  for(var i=0;i<=4;i++){
    var d=document.getElementById('d'+i);
    if(d) d.className='step-dot'+(i<s?' done':i===s?' active':'');
  }
}
function confettiBurst(){
  var c=document.getElementById('confetti');c.innerHTML='';
  var cols=['#ffe066','#2e7d32','#f44336','#1976d2','#f59e0b','#9c27b0'];
  for(var i=0;i<52;i++){
    var p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+
      ';width:'+(8+Math.random()*8)+'px;height:'+(8+Math.random()*8)+'px;'+
      'border-radius:'+(Math.random()>.5?'50%':'2px')+';'+
      'animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.5+Math.random())+'s';
    c.appendChild(p);
  }
  setTimeout(function(){c.innerHTML='';},3000);
}

// ── STEP 0 — Preface ──────────────────────────────────────
function renderStep0(){
  // Show real price tags
  var prices=['£0.49','£1.20','£2.75','£0.99','£3.50'];
  var tagHtml=prices.map(function(p){
    return '<div style="background:#fff;border:3px solid #a5d6a7;border-radius:12px;padding:10px 14px;'+
      'font-family:Fredoka One,cursive;font-size:clamp(18px,4vw,26px);color:#1b5e20;'+
      'box-shadow:0 3px 8px rgba(0,0,0,.1)">'+p+'</div>';
  }).join('');

  document.getElementById('mainArea').innerHTML=
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">📘</div><div><strong>What you will learn:</strong> What decimal numbers are, how the decimal point works, and how to read, compare and add decimals.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🌍</div><div><strong>Why it matters:</strong> Every price, every measurement, every sports score uses decimals. Money is the most common decimal system — £1.49 means 1 whole pound and 49 hundredths of a pound.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🎯</div><div><strong>By the end:</strong> You will understand place value in decimals, be able to compare them and add them — just like adding prices in a shop!</div></div>'+
    '</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#1b5e20;text-align:center;margin-bottom:10px">You already use decimals every day!</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">'+tagHtml+'</div>'+
    '<div style="text-align:center;font-size:clamp(13px,2.5vw,15px);font-weight:700;color:#555;margin-top:8px">Every price tag is a decimal number!</div>';
}

// ── STEP 1 — Place value explorer ─────────────────────────
function renderStep1(){
  sliderVal = 149;
  // Build static shell ONCE — slider never gets recreated
  var html =
    '<div class="numline-wrap" id="nlWrap"></div>'+
    '<div id="pvDisplay"></div>'+
    '<div class="slider-section">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#1b5e20;text-align:center;margin-bottom:6px">Drag to explore decimal values:</div>'+
    '<input type="range" min="1" max="299" value="149" id="decSlider" style="margin-bottom:0">'+
    '<div style="position:relative;height:38px;margin-bottom:4px"><svg id="rulerSvg" viewBox="0 0 300 38" width="100%" style="display:block;overflow:visible"></svg></div>'+
    '</div>'+
    '<div style="display:flex;justify-content:center;align-items:stretch;gap:0;margin-top:10px;font-family:Fredoka One,cursive;" id="pvBoxes"></div>'+
    '<div style="text-align:center;margin-top:8px;font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#555" id="pvWords"></div>';
  document.getElementById('mainArea').innerHTML = html;

  // Wire up slider — direct event listener, no oninput attribute
  var slider = document.getElementById('decSlider');
  if (slider) {
    slider.addEventListener('input', function(){ updateDisplay(parseInt(this.value)); });
    slider.addEventListener('change', function(){ updateDisplay(parseInt(this.value)); });
  }

  // Initial render
  updateDisplay(149);
}

function updateDisplay(v) {
  sliderVal = v;
  var ones = Math.floor(v/100);
  var tenths = Math.floor((v%100)/10);
  var hundredths = v%10;
  var display = ones+'.'+tenths+hundredths;

  // 1. Number line
  var nlWrap = document.getElementById('nlWrap');
  if (nlWrap) {
    var nlW = 320; var pct = (v/300)*100;
    var marks = '';
    for (var i=0;i<=3;i++) {
      var nx = Math.round((i/3)*nlW);
      marks += '<line x1="'+nx+'" y1="18" x2="'+nx+'" y2="30" stroke="#2e7d32" stroke-width="2"/>';
      marks += '<text x="'+nx+'" y="42" text-anchor="middle" font-size="12" fill="#1b5e20" font-family="Fredoka One,cursive">'+i+'</text>';
      if (i<3) {
        for (var d=1;d<10;d++) {
          var dx = Math.round(((i+d/10)/3)*nlW);
          marks += '<line x1="'+dx+'" y1="22" x2="'+dx+'" y2="28" stroke="#81c784" stroke-width="1"/>';
        }
      }
    }
    var markerX = Math.round((v/300)*nlW);
    nlWrap.innerHTML = '<svg viewBox="0 0 '+nlW+' 50" width="100%" style="display:block;max-width:360px;margin:0 auto">'+
      '<rect x="0" y="22" width="'+nlW+'" height="6" rx="3" fill="#c8e6c9"/>'+
      marks+
      '<line x1="'+markerX+'" y1="10" x2="'+markerX+'" y2="36" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>'+
      '<polygon points="'+markerX+',6 '+(markerX-6)+',14 '+(markerX+6)+',14" fill="#e53935"/>'+
      '<text x="'+markerX+'" y="50" text-anchor="middle" font-size="13" fill="#e53935" font-family="Fredoka One,cursive">'+display+'</text>'+
      '</svg>';
  }

  // 2. Ruler marker only — ticks are static, only move the red triangle
  var rulerSvg = document.getElementById('rulerSvg');
  if (rulerSvg) {
    // Build ticks once if not done
    if (!rulerSvg.dataset.built) {
      var rs = '';
      var majors = [0,0.5,1.0,1.5,2.0,2.5,3.0];
      for (var mi=0;mi<majors.length;mi++) {
        var mv = majors[mi];
        var mx2 = Math.round((mv/3)*280)+10;
        rs += '<line x1="'+mx2+'" y1="2" x2="'+mx2+'" y2="18" stroke="#2e7d32" stroke-width="2"/>';
        rs += '<text x="'+mx2+'" y="30" text-anchor="middle" font-size="11" fill="#1b5e20" font-family="Fredoka One,cursive">'+mv.toFixed(1)+'</text>';
      }
      for (var t=0;t<=30;t++) {
        var tv = t/10;
        var tp = Math.round((tv/3)*280)+10;
        var isMaj = majors.some(function(m){return Math.abs(m-tv)<0.01;});
        if (!isMaj) rs += '<line x1="'+tp+'" y1="6" x2="'+tp+'" y2="14" stroke="#a5d6a7" stroke-width="1.5"/>';
      }
      rs += '<polygon id="rulerMarker" points="10,0 5,6 15,6" fill="#e53935"/>';
      rulerSvg.innerHTML = rs;
      rulerSvg.dataset.built = '1';
    }
    // Move only the marker
    var marker = document.getElementById('rulerMarker');
    if (marker) {
      var cx = Math.round((v/300)*280)+10;
      marker.setAttribute('points', cx+',0 '+(cx-5)+',6 '+(cx+5)+',6');
    }
  }

  // 3. Place value boxes
  var pvBoxes = document.getElementById('pvBoxes');
  if (pvBoxes) {
    pvBoxes.innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;background:'+(ones>0?'rgba(46,125,50,.15)':'#f5f5f5')+';border:2.5px solid '+(ones>0?'#2e7d32':'#ddd')+';border-radius:10px 0 0 10px;padding:8px 14px;min-width:60px;">'+
        '<div style="font-size:clamp(26px,6vw,38px);color:#1b5e20;line-height:1">'+ones+'</div>'+
        '<div style="font-size:11px;color:#666;margin-top:3px">ones</div></div>'+
      '<div style="display:flex;align-items:center;padding:0 4px;font-size:clamp(28px,6vw,40px);color:#e53935;font-weight:900;align-self:center">.</div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;background:'+(tenths>0?'rgba(245,158,11,.15)':'#f5f5f5')+';border-top:2.5px solid '+(tenths>0?'#f59e0b':'#ddd')+';border-bottom:2.5px solid '+(tenths>0?'#f59e0b':'#ddd')+';padding:8px 14px;min-width:60px;">'+
        '<div style="font-size:clamp(26px,6vw,38px);color:#e65100;line-height:1">'+tenths+'</div>'+
        '<div style="font-size:11px;color:#666;margin-top:3px">tenths</div></div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;background:'+(hundredths>0?'rgba(25,118,210,.15)':'#f5f5f5')+';border:2.5px solid '+(hundredths>0?'#1976d2':'#ddd')+';border-radius:0 10px 10px 0;padding:8px 14px;min-width:60px;">'+
        '<div style="font-size:clamp(26px,6vw,38px);color:#1976d2;line-height:1">'+hundredths+'</div>'+
        '<div style="font-size:11px;color:#666;margin-top:3px">hundredths</div></div>';
  }

  // 4. Words
  var pvWords = document.getElementById('pvWords');
  if (pvWords) {
    pvWords.innerHTML =
      '<span style="color:#2e7d32">'+ones+' one'+(ones!==1?'s':'')+'</span> + '+
      '<span style="color:#e65100">'+tenths+' tenth'+(tenths!==1?'s':'')+'</span> + '+
      '<span style="color:#1976d2">'+hundredths+' hundredth'+(hundredths!==1?'s':'')+'</span>';
  }

  // 5. Nia
  var nia = document.getElementById('nia');
  if (nia) {
    nia.innerHTML = 'The number <em>'+display+'</em> has <strong>'+ones+'</strong> in the ones, <strong>'+tenths+'</strong> in the tenths, and <strong>'+hundredths+'</strong> in the hundredths!';
  }
}

// Keep old functions as no-ops to avoid errors
function buildPlaceValue(){}
function buildRulerSvg(){return '';}
var _rafPending=false;
function scheduleUpdate(val){ updateDisplay(parseInt(val)); }
function updateSlider(val){ updateDisplay(parseInt(val)); }


// ── STEP 2 — Shopping ─────────────────────────────────────
function renderStep2(){
  basketItems=[];
  buildShop();
}

function buildShop(){
  var total=0;
  basketItems.forEach(function(i){total+=SHOP[i].price;});
  total=Math.round(total*100)/100;

  var itemsHtml=SHOP.map(function(item,i){
    var inBasket=basketItems.indexOf(i)>=0;
    return '<div class="shop-item'+(inBasket?' in-basket':'')+'" onclick="toggleItem('+i+')">'+
      '<div class="shop-item-emoji">'+item.emoji+'</div>'+
      '<div class="shop-item-name">'+item.name+'</div>'+
      '<div class="shop-item-price">£'+item.price.toFixed(2)+'</div>'+
      (inBasket?'<div style="font-size:11px;font-weight:900;color:#2e7d32">✅ in basket</div>':'')+'</div>';
  }).join('');

  var totalStr='£'+total.toFixed(2);
  var breakdown=basketItems.map(function(i){return '£'+SHOP[i].price.toFixed(2);}).join(' + ');

  document.getElementById('mainArea').innerHTML=
    '<div class="shop-scene">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,18px);color:#1b5e20;text-align:center;margin-bottom:10px">🛒 Priya\'s Market — tap items to add to basket!</div>'+
    '<div class="shop-items">'+itemsHtml+'</div>'+
    '<div class="basket-total">'+
    (basketItems.length===0?'Basket empty — tap items above!':
    breakdown+' = <span style="color:#ffe066">'+totalStr+'</span>')+
    '</div>'+
    '</div>'+
    '<div style="background:rgba(255,255,255,.85);border:2.5px solid #a5d6a7;border-radius:14px;padding:10px 14px;font-size:clamp(13px,2.5vw,15px);font-weight:700;color:#1b5e20;text-align:center">'+
    '💡 Adding decimals: line up the decimal points and add just like whole numbers! '+totalStr+' = '+Math.floor(total)+'p whole + '+(Math.round(total*100)%100)+'p parts'+
    '</div>';
}

function toggleItem(idx){
  var pos=basketItems.indexOf(idx);
  if(pos>=0){basketItems.splice(pos,1);}
  else{basketItems.push(idx);}
  buildShop();
  var total=0;
  basketItems.forEach(function(i){total+=SHOP[i].price;});
  total=Math.round(total*100)/100;
  document.getElementById('nia').innerHTML=
    basketItems.length===0?NIA[2]:
    'Basket total: <em>£'+total.toFixed(2)+'</em>! That is <strong>'+Math.floor(total)+'</strong> whole pound'+(Math.floor(total)!==1?'s':'')+' and <strong>'+(Math.round(total*100)%100)+'</strong> pence!';
}

// ── STEP 3 — Quiz ─────────────────────────────────────────
function renderStep3(){
  quizIdx=0;
  quizCorrect=0;
  document.getElementById('nia').innerHTML=NIA[3];
  showQuizQ();
}

function showQuizQ(){
  if(quizIdx>=QUIZ_QS.length){showQuizEnd();return;}
  var q=QUIZ_QS[quizIdx];
  // Reset nia to neutral prompt for each new question
  var nia=document.getElementById('nia');
  if(nia) nia.innerHTML='Look at the question carefully — then pick your answer! 🌟';
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var opts='';
  q.opts.forEach(function(o){
    opts+='<button class="quiz-btn" onclick="answerQ(\''+o.replace(/'/g,"\\'")+'\',\''+q.answer.replace(/'/g,"\\'")+'\')">'+o+'</button>';
  });
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div class="quiz-area"><div class="quiz-q">'+q.q+'</div>'+
    '<div class="quiz-options">'+opts+'</div>'+
    '<div class="quiz-result" id="qRes"></div></div>';
}

function answerQ(chosen,correct){
  var btns=document.querySelectorAll('.quiz-btn,.opt,.ans-tile,.ans-row');
  btns.forEach(function(b){b.onclick=null;b.style.cursor='default';if(b.disabled!==undefined)b.disabled=true;});
  var res=document.getElementById('qRes')||document.getElementById('pzRes')||document.getElementById('quizResult');
  if(chosen===correct){

    btns.forEach(function(b){if(b.textContent.trim()===correct)b.className='quiz-btn correct';});
    quizCorrect++;
    if(res){res.textContent='✅ Correct!';res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='✅ <strong>Correct!</strong> 💰';
  
  } else {

    btns.forEach(function(b){
      if(b.textContent.trim()===chosen)b.className='quiz-btn wrong';
      if(b.textContent.trim()===correct)b.className='quiz-btn correct';
    });
    if(res){res.textContent='❌ The answer is: '+correct;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='💛 The answer is <strong>'+correct+'</strong>!';
  
  }
  quizIdx++;
  var isLast=(quizIdx>=QUIZ_QS.length);
  if(chosen===correct){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQuizEnd():showQuizQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQuizEnd():showQuizQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQuizEnd(){
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var msg=quizCorrect===4?'🏆 PERFECT! You are a decimal expert!':
          quizCorrect>=3?'🌟 Brilliant! Almost perfect!':
          quizCorrect>=2?'👍 Good work!':'💪 Keep going!';
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div style="text-align:center;padding:16px;background:linear-gradient(135deg,#e8f5e9,#f9fbe7);border-radius:18px;border:2.5px solid #a5d6a7">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#1b5e20;margin-bottom:8px">'+msg+'</div>'+
    '<div style="font-size:clamp(14px,3vw,17px);font-weight:700;color:#555">You got <strong style="color:#e53935">'+quizCorrect+'</strong> out of <strong>4</strong> correct!</div></div>';
  if(quizCorrect>=3)confettiBurst();
  document.getElementById('nia').innerHTML=quizCorrect===4?'🏆 <strong>Perfect!</strong> You understand decimals completely! 💰':'🌟 Well done! Remember — the decimal point separates whole numbers from parts!';

  // Start again button
  var sa=document.createElement('button');
  sa.textContent='Start again';
  sa.style.cssText='display:block;margin:16px auto 0;padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)';
  sa.onclick=function(){goStep(-4);};
  var _ep=document.getElementById('mainArea')||document.getElementById('main');
  if(_ep) _ep.appendChild(sa);
}

// ── STEP 4 — Summary ──────────────────────────────────────
function renderStep4(){
  document.getElementById('mainArea').innerHTML=
    '<div style="text-align:center;padding:8px 0 14px">'+
    '<div style="font-size:56px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#1b5e20;margin-top:8px;margin-bottom:14px">You understand decimals!</div>'+
    '</div>'+
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>The <strong>decimal point</strong> separates whole numbers (left) from parts of a number (right).</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>After the decimal point: <strong>tenths</strong> (1st digit) → <strong>hundredths</strong> (2nd digit). So 1.49 = 1 one + 4 tenths + 9 hundredths.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>To <strong>compare</strong> decimals, look at the ones first, then tenths — 0.7 is greater than 0.35 because 7 tenths is more than 3 tenths.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>To <strong>add</strong> decimals, line up the decimal points and add column by column — just like whole numbers!</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🚀</div><div>Next — we will explore <strong>percentages</strong>: another way to express parts of a whole!</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+
    ['0.1 = 10p','0.50 = 50p','1.00 = 100p','1.50 = 150p','2.50 = 250p'].map(function(f){
      return '<div style="background:#fff;border:2px solid #a5d6a7;border-radius:10px;padding:8px 12px;'+
        'font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,16px);color:#1b5e20">'+f+'</div>';
    }).join('')+
    '</div>';
  confettiBurst();
}

function goStep(dir){
  currentStep=Math.max(0,Math.min(4,currentStep+dir));
  dots(currentStep);
  document.getElementById('nia').innerHTML=NIA[currentStep];
  document.getElementById('btnBack').disabled=(currentStep===0);
  document.getElementById('btnNext').textContent=BTNS[currentStep];
  document.getElementById('btnNext').disabled=false;
  if(currentStep===4){document.getElementById('btnNext').onclick=function(){goStep(-4);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  RENDERS[currentStep]();
}
goStep(0);
</script>

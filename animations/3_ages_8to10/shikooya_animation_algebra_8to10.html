<style>

];

function scaleSVG(balanced){
  // Full 3D isometric balance scale
  var W=320, H=180;
  var bc=balanced?'#4f46e5':'#dc2626';
  var tilt=balanced?0:10; // degrees beam tilts when unbalanced

  // Isometric helpers — project 3D to 2D isometric
  function iso(x,y,z){
    // standard isometric: x right, y up, z toward viewer
    var sx = W/2 + (x - z) * 0.866;
    var sy = H/2 - y + (x + z) * 0.5;
    return [sx, sy];
  }

  var s = '<svg viewBox="0 0 '+W+' '+H+'" class="scale-svg" xmlns="http://www.w3.org/2000/svg">';

  // ── BASE BLOCK (3D box) ───────────────────────────────
  // Bottom rectangle top face, front face, side face
  var bx=0, by=-60, bw=18, bh=8, bd=12;
  // top face
  var tl=iso(bx,by,0), tr=iso(bx+bw,by,0), br2=iso(bx+bw,by,bd), bl2=iso(bx,by,bd);
  s+='<polygon points="'+tl[0]+','+tl[1]+' '+tr[0]+','+tr[1]+' '+br2[0]+','+br2[1]+' '+bl2[0]+','+bl2[1]+'" fill="#b0bec5"/>';
  // front face
  var fl1=iso(bx,by,bd), fr1=iso(bx+bw,by,bd), fr2b=iso(bx+bw,by-bh,bd), fl2b=iso(bx,by-bh,bd);
  s+='<polygon points="'+fl1[0]+','+fl1[1]+' '+fr1[0]+','+fr1[1]+' '+fr2b[0]+','+fr2b[1]+' '+fl2b[0]+','+fl2b[1]+'" fill="#90a4ae"/>';
  // right face
  var rr1=iso(bx+bw,by,0), rr2=iso(bx+bw,by,bd), rr3=iso(bx+bw,by-bh,bd), rr4=iso(bx+bw,by-bh,0);
  s+='<polygon points="'+rr1[0]+','+rr1[1]+' '+rr2[0]+','+rr2[1]+' '+rr3[0]+','+rr3[1]+' '+rr4[0]+','+rr4[1]+'" fill="#78909c"/>';

  // ── POLE (thin vertical cylinder approximation) ───────
  var px=9, pz=6, ptop=-60+bh, pbottom=-60;
  var p1=iso(px-2,pbottom,pz), p2=iso(px+2,pbottom,pz);
  var p3=iso(px+2,ptop+65,pz), p4=iso(px-2,ptop+65,pz);
  s+='<polygon points="'+p1[0]+','+p1[1]+' '+p2[0]+','+p2[1]+' '+p3[0]+','+p3[1]+' '+p4[0]+','+p4[1]+'" fill="'+bc+'" opacity="0.9"/>';
  // pole front edge highlight
  s+='<line x1="'+p1[0]+'" y1="'+p1[1]+'" x2="'+p4[0]+'" y2="'+p4[1]+'" stroke="white" stroke-width="1" opacity="0.4"/>';

  // ── PIVOT SPHERE at top of pole ───────────────────────
  var pivotPos=iso(px,ptop+65,pz);
  s+='<circle cx="'+pivotPos[0]+'" cy="'+pivotPos[1]+'" r="7" fill="'+bc+'"/>';
  s+='<circle cx="'+(pivotPos[0]-2)+'" cy="'+(pivotPos[1]-2)+'" r="2.5" fill="white" opacity="0.5"/>';

  // ── BEAM (rotated by tilt) ────────────────────────────
  // Beam goes from left arm to right arm, pivoting at centre
  // We approximate the tilt with slight vertical offset on each side
  var beamY=ptop+65;
  var leftOff=balanced?0:tilt*0.6;    // left pan goes up when lighter
  var rightOff=balanced?0:-tilt*0.6;  // right pan goes down when heavier

  var beamLeft=iso(px-56, beamY+leftOff, pz);
  var beamRight=iso(px+56, beamY+rightOff, pz);
  var beamCentre=iso(px, beamY, pz);

  // Beam as thick 3D bar
  var bThick=4;
  s+='<line x1="'+beamLeft[0]+'" y1="'+beamLeft[1]+'" x2="'+beamRight[0]+'" y2="'+beamRight[1]+'" stroke="'+bc+'" stroke-width="6" stroke-linecap="round"/>';
  s+='<line x1="'+beamLeft[0]+'" y1="'+(beamLeft[1]+bThick)+'" x2="'+beamRight[0]+'" y2="'+(beamRight[1]+bThick)+'" stroke="'+bc+'" stroke-width="2" opacity="0.35"/>';

  // ── CHAINS / STRINGS ──────────────────────────────────
  var chainLen=28;
  var leftPanPos=iso(px-56, beamY+leftOff-chainLen, pz);
  var rightPanPos=iso(px+56, beamY+rightOff-chainLen, pz);

  // Left chain
  s+='<line x1="'+beamLeft[0]+'" y1="'+beamLeft[1]+'" x2="'+leftPanPos[0]+'" y2="'+leftPanPos[1]+'" stroke="#90a4ae" stroke-width="1.5"/>';
  // Right chain
  s+='<line x1="'+beamRight[0]+'" y1="'+beamRight[1]+'" x2="'+rightPanPos[0]+'" y2="'+rightPanPos[1]+'" stroke="#90a4ae" stroke-width="1.5"/>';

  // ── PANS (3D ellipse dishes) ──────────────────────────
  function drawPan(cx,cy,label,isLeft){
    var rx=26, ry=9;
    // shadow ellipse
    s+='<ellipse cx="'+cx+'" cy="'+(cy+4)+'" rx="'+(rx-2)+'" ry="'+(ry-2)+'" fill="rgba(0,0,0,.12)"/>';
    // rim top
    s+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1.5"/>';
    // inner bowl highlight
    s+='<ellipse cx="'+cx+'" cy="'+(cy+1)+'" rx="'+(rx-6)+'" ry="'+(ry-4)+'" fill="#e8edf0" opacity="0.7"/>';
    // bottom edge of pan (3D depth)
    s+='<ellipse cx="'+cx+'" cy="'+(cy+5)+'" rx="'+rx+'" ry="'+(ry*0.6)+'" fill="none" stroke="#b0bec5" stroke-width="1"/>';
    // Label inside pan
    s+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" dominant-baseline="middle" '+
      'font-size="13" font-family="DM Serif Display,serif" font-style="italic" fill="#374151">'+label+'</text>';
  }

  drawPan(leftPanPos[0], leftPanPos[1], 'x', true);
  drawPan(rightPanPos[0], rightPanPos[1], '?', false);

  // ── STATUS TEXT ────────────────────────────────────────
  var statusY=18;
  s+='<text x="'+W/2+'" y="'+statusY+'" text-anchor="middle" font-size="12" '+
    'font-family="DM Sans,sans-serif" font-weight="700" fill="'+bc+'">'+
    (balanced?'⚖ Both sides balanced':'⚖ Out of balance')+
    '</text>';

  s+='</svg>';
  return s;
}

function renderStep0(){
  document.getElementById('mainArea').innerHTML=
    '<div class="panel">'+
    '<div class="pf-row"><div class="pf-icon">&#128216;</div><div><strong style="color:var(--ink)">What you will learn:</strong> Using letters to represent unknown numbers, and solving equations by working backwards.</div></div>'+
    '<div class="pf-row"><div class="pf-icon">&#127758;</div><div><strong style="color:var(--ink)">Why it matters:</strong> Every branch of advanced mathematics uses algebra. From engineering to computing - algebra describes the unknown.</div></div>'+
    '<div class="pf-row"><div class="pf-icon">&#127919;</div><div><strong style="color:var(--ink)">By the end:</strong> You will solve one-step and two-step equations, and see every equation as a balanced scale.</div></div>'+
    '</div>'+
    '<div class="panel" style="text-align:center">'+
    '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:16px">The big idea</p>'+
    scaleSVG(true)+
    '<p style="font-size:clamp(14px,3vw,16px);color:var(--ink2);margin-top:16px;line-height:1.7">An equation is a <strong style="color:var(--ink)">balanced scale</strong>.<br>Whatever you do to one side, you must do to the other.</p>'+
    '</div>';
}

function renderStep1(){puzzleLevel=0;levelAnswered=false;showPuzzle();}

function showPuzzle(){
  if(puzzleLevel>=PUZZLES.length){showAllDone();return;}
  var pz=PUZZLES[puzzleLevel];levelAnswered=false;
  var pips='';for(var i=0;i<PUZZLES.length;i++)pips+='<div class="prog-pip'+(i<puzzleLevel?' dp':i===puzzleLevel?' cp':'')+'" ></div>';
  var choices='';pz.choices.forEach(function(c){choices+='<button class="choice-btn" id="ab'+c+'" onclick="pickAnswer('+c+','+pz.answer+')">'+c+'</button>';});
  document.getElementById('mainArea').innerHTML=
    '<div class="panel">'+
    '<div class="prog-row"><span class="prog-label">Puzzle '+pz.label+'</span><div class="prog-pips">'+pips+'</div></div>'+
    '<p class="story-text">'+pz.story+'</p>'+
    '<div class="eq-block"><div class="eq-text">'+pz.eqHtml+'</div><p class="eq-subtitle">What is the value of x?</p></div>'+
    '<p class="choices-label">Pick your answer</p>'+
    '<div class="choices-row">'+choices+'</div>'+
    '<div id="stepsBox"></div>'+
    '<div class="quiz-result" id="pzResult"></div>'+
    '</div>';
}

function pickAnswer(chosen,correct){
  if(levelAnswered)return;levelAnswered=true;
  var pz=PUZZLES[puzzleLevel];
  var res=document.getElementById('pzResult');
  var btn=document.getElementById('ab'+chosen);
  var cBtn=document.getElementById('ab'+correct);
  if(chosen===correct){
    if(btn)btn.className='choice-btn correct';
    if(res){res.textContent='Correct - x = '+correct;res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='<strong>x = '+correct+'.</strong> '+pz.explain;
    if(puzzleLevel===PUZZLES.length-1)confettiBurst();
  } else {
    if(btn)btn.className='choice-btn wrong';
    if(cBtn)setTimeout(function(){if(cBtn)cBtn.className='choice-btn correct';},350);
    if(res){res.textContent='x = '+correct+'. '+pz.explain;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='x = <strong>'+correct+'</strong>. '+pz.explain;
  }
  var sb=document.getElementById('stepsBox');
  if(sb){sb.innerHTML='<div class="steps-reveal"><div class="steps-title">Working</div>'+
    pz.steps.map(function(s,i){return '<div class="step-line"><div class="step-num">'+(i+1)+'</div><div>'+s+'</div></div>';}).join('')+
    '</div>';}
  setTimeout(function(){puzzleLevel++;showPuzzle();},2600);
}

function showAllDone(){
  // celebration handled in pickAnswer on correct last answer
  document.getElementById('mainArea').innerHTML=
    '<div class="panel" style="text-align:center;padding:32px 24px">'+
    '<div style="font-size:52px;margin-bottom:16px">&#127890;</div>'+
    '<div style="font-family:DM Serif Display,serif;font-size:clamp(20px,5vw,28px);color:var(--ink);margin-bottom:8px">All four equations solved.</div>'+
    '<p style="font-size:14px;color:var(--muted);line-height:1.7">You found the unknown in every puzzle by working backwards.</p>'+
    '</div>';
  document.getElementById('nia').innerHTML='You solved every equation. <strong>Algebra finds the unknown by working backwards</strong> - undoing each operation in reverse.';
}

function renderStep2(){
  document.getElementById('mainArea').innerHTML=
    '<div class="panel">'+
    '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;text-align:center">Equation explorer</p>'+
    '<p style="font-size:13px;color:var(--ink2);text-align:center;margin-bottom:8px">x + 4 = ?</p>'+
    '<div id="explEq" class="explore-eq"><span class="xv">3</span> + 4 = <span class="rv">7</span></div>'+
    '<div class="slider-wrap">'+
    '<input type="range" min="1" max="10" value="3" id="xSlider">'+
    '<div class="slider-ticks"><span>x=1</span><span>x=5</span><span>x=10</span></div>'+
    '</div>'+
    '<div id="balStatus" class="balance-status" style="color:var(--green)">Both sides equal 7 when x = 3</div>'+
    '</div>'+
    '<div class="panel" style="padding:16px 24px">'+
    '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Key rules</p>'+
    ['+ is undone by -','- is undone by +','x is undone by division','division is undone by x'].map(function(r){
      return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)">'+
        '<div style="width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0"></div>'+
        '<div style="font-size:14px;color:var(--ink2);font-weight:500">'+r+'</div></div>';
    }).join('')+
    '</div>';
  var sl=document.getElementById('xSlider');
  if(sl)sl.addEventListener('input',function(){updateExplore(parseInt(this.value));});
  updateExplore(3);
}

function updateExplore(x){
  var right=x+4;
  var eq=document.getElementById('explEq');
  if(eq)eq.innerHTML='<span class="xv">'+x+'</span> + 4 = <span class="rv">'+right+'</span>';
  var bs=document.getElementById('balStatus');
  if(bs)bs.textContent='Both sides equal '+right+' when x = '+x;
  var nia=document.getElementById('nia');
  if(nia)nia.innerHTML='When <strong>x = '+x+'</strong>, then x + 4 = <em>'+right+'</em>. Both sides balance. Algebra reverses this - if we know the answer is '+right+', we can find x.';
}

function renderStep3(){quizIdx=0;quizCorrect=0;document.getElementById('nia').innerHTML=NIA[3];showQuizQ();}

function showQuizQ(){
  if(quizIdx>=QUIZ_QS.length){showQuizEnd();return;}
  var q=QUIZ_QS[quizIdx];
  var nia=document.getElementById('nia');if(nia)nia.innerHTML='Read carefully - then pick your answer.';
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >&#11088;</div>';
  var opts='';
  q.opts.forEach(function(o,oi){
    var safe=o.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    opts+='<button class="quiz-opt" id="qo'+oi+'" data-val="'+safe+'" onclick="answerQIdx('+oi+')">'+o+'</button>';
  });
  document.getElementById('mainArea').innerHTML=
    '<div class="panel"><div class="stars-row">'+stars+'</div><div class="quiz-q-text">'+q.q+'</div>'+
    '<div class="quiz-opts">'+opts+'</div><div class="quiz-result" id="qRes"></div></div>';
}

function answerQIdx(idx){
  var btns=document.querySelectorAll('.quiz-opt');
  var chosen=btns[idx]?btns[idx].getAttribute('data-val'):'';
  var correct=QUIZ_QS[quizIdx].answer;
  // find correct btn
  var cIdx=-1;
  btns.forEach(function(b,i){if(b.getAttribute('data-val')===correct)cIdx=i;});
  answerQ(chosen,correct);
}
function answerQ(chosen,correct){

  var btns=document.querySelectorAll('.quiz-opt');btns.forEach(function(b){b.disabled=true;});
  var res=document.getElementById('qRes');
  if(chosen===correct){
    btns.forEach(function(b){if(b.textContent.trim()===correct)b.className='quiz-opt correct';});
    quizCorrect++;if(res){res.textContent='Correct.';res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='Correct.';
  } else {
    btns.forEach(function(b){if(b.textContent.trim()===chosen)b.className='quiz-opt wrong';if(b.textContent.trim()===correct)b.className='quiz-opt correct';});
    if(res){res.textContent='The answer is: '+correct;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='The answer is <strong>'+correct+'</strong>.';
  }
    quizIdx++;
  var isLast=(quizIdx>=QUIZ_QS.length);
  if(chosen===correct){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQuizEnd():showQuizQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQuizEnd():showQuizQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQuizEnd(){
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >&#11088;</div>';
  if(quizCorrect===4)confettiBurst();
  document.getElementById('mainArea').innerHTML=
    '<div class="panel"><div class="stars-row">'+stars+'</div>'+
    '<div class="result-card">'+
    '<div class="big">'+(quizCorrect===4?'Perfect score.':quizCorrect>=3?'Almost perfect.':quizCorrect>=2?'Good work.':'Keep going.')+'</div>'+
    '<div class="sub">You got <strong>'+quizCorrect+'</strong> out of 4 correct.</div>'+
    '<div style="text-align:center;margin-top:16px">'+'<button onclick="goStep(-4)" style="padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)">Start again</button>'+'</div>'+'</div></div>';
  document.getElementById('nia').innerHTML=(quizCorrect===4?'<strong>Perfect.</strong> ':'<strong>Well done.</strong> ')+'Algebra finds the unknown by working backwards.';
}

function renderStep4(){
  var cards=PUZZLES.map(function(pz){
    return '<div class="sum-card"><div class="sum-eq">'+pz.eqHtml+'</div>'+
      '<div class="sum-work">'+pz.steps[1]+'<br>'+pz.steps[2]+'</div>'+
      '<div class="sum-ans">x = '+pz.answer+'</div></div>';
  }).join('');
  document.getElementById('mainArea').innerHTML=
    '<div class="panel">'+
    '<p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">What we learned</p>'+
    '<div class="pf-row"><div class="pf-icon">&#9989;</div><div>A <strong style="color:var(--ink)">letter (x)</strong> represents an unknown number. An equation must balance on both sides.</div></div>'+
    '<div class="pf-row"><div class="pf-icon">&#9989;</div><div>To solve, <strong style="color:var(--ink)">work backwards</strong> - undo each operation in reverse order.</div></div>'+
    '<div class="pf-row"><div class="pf-icon">&#9989;</div><div>+ is undone by -, and multiplication is undone by division. Always apply to both sides.</div></div>'+
    '<div class="pf-row" style="border-bottom:none"><div class="pf-icon">&#128640;</div><div>Next: <strong style="color:var(--ink)">Measurement and Unit Conversions</strong>.</div></div>'+
    '</div>'+
    '<div class="sum-grid">'+cards+'</div>';
  confettiBurst();
}

function goStep(dir){
  currentStep=Math.max(0,Math.min(4,currentStep+dir));
  dots(currentStep);
  document.getElementById('nia').innerHTML=NIA[currentStep];
  document.getElementById('btnBack').disabled=(currentStep===0);
  document.getElementById('btnNext').textContent=BTNS[currentStep];
  document.getElementById('btnNext').disabled=false;
  if(currentStep===4){document.getElementById('btnNext').onclick=function(){goStep(-4);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  RENDERS[currentStep]();
}
goStep(0);
</script>
</body>
</html>

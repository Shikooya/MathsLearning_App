<title>Shikooya — Ratio & Proportion (Ages 8–10)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
  :root{--txt:#1a1a2e;--panel:rgba(255,255,255,0.95);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;
    background:linear-gradient(180deg,#fce4ec 0%,#f8bbd0 100%);
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:16px;}
  .header{text-align:center;margin-bottom:12px;width:100%;max-width:720px;}
  .age-badge{display:inline-block;background:linear-gradient(135deg,#c2185b,#880e4f);
    color:#fff;font-size:13px;font-weight:900;letter-spacing:.06em;
    text-transform:uppercase;padding:5px 18px;border-radius:20px;margin-bottom:8px;
    box-shadow:0 3px 10px rgba(194,24,91,.35);}
  .header h1{font-family:'Fredoka One',cursive;font-size:clamp(22px,5vw,32px);
    color:#880e4f;line-height:1.2;}
  .header h1 span{color:#f59e0b;}
  .card{background:var(--panel);border-radius:28px;padding:20px;max-width:720px;width:100%;
    box-shadow:0 12px 48px rgba(0,0,0,.12);border:3px solid rgba(194,24,91,.2);}
  .steps{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .step-dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:all .3s;}
  .step-dot.active{background:#f59e0b;transform:scale(1.5);}
  .step-dot.done{background:#c2185b;}
  .nia-area{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;min-height:60px;}
  .nia-avatar{width:52px;height:52px;flex-shrink:0;background:linear-gradient(135deg,#c2185b,#880e4f);
    border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;
    box-shadow:0 4px 12px rgba(194,24,91,.3);animation:bob 2.5s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .nia-bubble{background:linear-gradient(135deg,#fce4ec,#f3e5f5);border:2.5px solid #f48fb1;
    border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:clamp(14px,3vw,17px);
    font-weight:700;color:var(--txt);line-height:1.6;flex:1;}
  .nia-bubble strong{color:#880e4f;}
  .nia-bubble em{color:#f59e0b;font-style:normal;font-weight:900;}
  .preface{background:linear-gradient(135deg,#fce4ec,#e8f5e9);border-radius:18px;
    padding:16px 18px;margin-bottom:16px;border:2.5px solid #f48fb1;}
  .preface-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;
    font-size:clamp(13px,2.5vw,15px);font-weight:700;color:var(--txt);line-height:1.6;}
  .preface-row:last-child{margin-bottom:0;}
  .preface-icon{font-size:22px;flex-shrink:0;margin-top:2px;}
  /* Recipe scene */
  .recipe-scene{background:linear-gradient(135deg,#fce4ec,#fff9c4);border-radius:18px;
    border:2.5px solid #f48fb1;padding:14px;margin-bottom:12px;}
  /* Ratio bar */
  .ratio-bar{display:flex;border-radius:12px;overflow:hidden;height:48px;
    margin-bottom:8px;border:2.5px solid rgba(0,0,0,.1);}
  .ratio-seg{display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka One',cursive;font-size:clamp(13px,3vw,16px);
    color:#fff;transition:all .4s ease;font-weight:900;}
  /* Ingredient rows */
  .ing-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .ing-emoji{font-size:clamp(24px,5vw,32px);}
  .ing-bar-wrap{flex:1;min-width:120px;}
  .ing-bar{height:28px;border-radius:8px;transition:width .4s ease;
    display:flex;align-items:center;padding-left:8px;
    font-family:'Fredoka One',cursive;font-size:clamp(12px,2.5vw,15px);color:#fff;
    min-width:40px;}
  .ing-label{font-family:'Fredoka One',cursive;font-size:clamp(12px,2.5vw,14px);
    color:#555;min-width:60px;text-align:right;}
  /* Slider */
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:10px;
    border-radius:5px;background:#f8bbd0;outline:none;cursor:pointer;touch-action:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;
    border-radius:50%;background:#c2185b;border:3px solid #fff;cursor:grab;
    box-shadow:0 2px 8px rgba(0,0,0,.25);}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;
    background:#c2185b;border:3px solid #fff;cursor:grab;}
  /* Scale cards */
  .scale-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .scale-card{background:#fff;border:2.5px solid #f48fb1;border-radius:14px;
    padding:10px 14px;text-align:center;flex:1;min-width:100px;max-width:180px;
    transition:all .3s;}
  .scale-card.active-scale{border-color:#c2185b;background:rgba(194,24,91,.06);
    transform:scale(1.04);}
  .scale-num{font-family:'Fredoka One',cursive;font-size:clamp(20px,5vw,28px);color:#880e4f;}
  .scale-label{font-family:'Fredoka One',cursive;font-size:clamp(11px,2.5vw,13px);color:#c2185b;}
  /* Proportion checker */
  .prop-check{background:linear-gradient(135deg,#fce4ec,#f3e5f5);border-radius:18px;
    border:2.5px solid #f48fb1;padding:14px;margin-bottom:12px;}
  /* Quiz */
  .quiz-area{background:linear-gradient(135deg,#fce4ec,#f3e5f5);border-radius:18px;
    padding:16px 18px;margin-bottom:14px;border:2.5px solid #f48fb1;}
  .quiz-q{font-family:'Fredoka One',cursive;font-size:clamp(16px,4vw,22px);
    color:var(--txt);margin-bottom:12px;text-align:center;line-height:1.5;}
  .quiz-options{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .quiz-btn{min-width:90px;min-height:60px;border-radius:14px;border:3px solid #ddd;background:#fff;
    font-family:'Fredoka One',cursive;font-size:clamp(14px,3vw,18px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 3px 8px rgba(0,0,0,.1);
    color:var(--txt);padding:8px;}
  .quiz-btn:hover{transform:scale(1.08);border-color:#c2185b;}
  .quiz-btn.correct{background:linear-gradient(135deg,#66bb6a,#43a047);border-color:#2e7d32;color:#fff;animation:pop .4s ease;}
  .quiz-btn.wrong{background:linear-gradient(135deg,#ef9a9a,#e57373);border-color:#c62828;color:#fff;animation:shake .3s ease;}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .quiz-result{text-align:center;margin-top:10px;font-family:'Fredoka One',cursive;
    font-size:clamp(14px,3.5vw,18px);min-height:26px;}
  .quiz-result.correct{color:#2e7d32;}
  .quiz-result.wrong{color:#c62828;}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:10px;}
  .star{font-size:28px;opacity:.25;transition:all .3s;}
  .star.earned{opacity:1;animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  .controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:4px;}
  .btn{min-width:64px;min-height:56px;padding:12px 20px;border-radius:16px;border:none;
    font-family:'Fredoka One',cursive;font-size:clamp(15px,3.5vw,19px);cursor:pointer;
    transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn-next{background:linear-gradient(135deg,#c2185b,#880e4f);color:#fff;flex:1;max-width:220px;}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-back{background:linear-gradient(135deg,#90a4ae,#607d8b);color:#fff;}
  .btn-back:hover{transform:translateY(-2px);}
  .btn-back:disabled{opacity:.3;cursor:not-allowed;transform:none;}
  .confetti-container{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:100;overflow:hidden;}
  .confetti-piece{position:absolute;border-radius:2px;animation:confetti-fall 2s ease-in forwards;}
  @keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

  /* Back to menu button */
  .back-menu{position:fixed;top:12px;left:12px;z-index:200;
    display:flex;align-items:center;gap:6px;
    padding:7px 12px;border-radius:20px;border:1.5px solid rgba(79,70,229,.2);
    background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;
    color:#4f46e5;text-decoration:none;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);transition:all .2s;}
  .back-menu:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
</style>
</head>
<body>
<a class="back-menu" href="../../index.html">&#8592; All topics</a>

<div class="header">
  <div><span class="age-badge">Ages 8–10</span></div>
  <h1>Priya's <span>Recipe</span> — Ratio & Proportion!</h1>
</div>
<div class="card">
  <!-- 5 steps = d0..d4 -->
  <div class="steps">
    <div class="step-dot active" id="d0"></div>
    <div class="step-dot" id="d1"></div>
    <div class="step-dot" id="d2"></div>
    <div class="step-dot" id="d3"></div>
    <div class="step-dot" id="d4"></div>
  </div>
  <div class="nia-area">
    <div class="nia-avatar">🌟</div>
    <div class="nia-bubble" id="nia">
      Priya is baking cookies! Her recipe needs <strong>2 cups of flour</strong> for every <strong>1 cup of sugar</strong>. That is a <em>ratio</em> — a way of comparing two amounts! 🍪
    </div>
  </div>
  <div id="mainArea"></div>
  <div class="controls">
    <button class="btn btn-back" id="btnBack" onclick="goStep(-1)" disabled>← Back</button>
    <button class="btn btn-next" id="btnNext" onclick="goStep(1)">Let's go! →</button>
  </div>
</div>
<div class="confetti-container" id="confetti"></div>

<script>
var currentStep=0, quizIdx=0, quizCorrect=0;
var batchCount=1; // number of batches of recipe

// ── Recipe data — ratio 2:1:3 (flour:sugar:butter in cups) ─
var RECIPE={
  name:'Priya\'s Cookies',
  ratio:[2,1,3],
  ings:[
    {name:'Flour',emoji:'🌾',color:'#f59e0b',unit:'cups'},
    {name:'Sugar',emoji:'🍬',color:'#e91e63',unit:'cups'},
    {name:'Butter',emoji:'🧈',color:'#ff8f00',unit:'tbsp'},
  ],
  makes:12,
  description:'flour : sugar : butter = 2 : 1 : 3',
};

// ── Quiz ───────────────────────────────────────────────────
var QUIZ_QS=[
  {q:'A ratio 2:1 means...',
   opts:['2 minus 1','2 for every 1','2 plus 1','2 divided by 1'],
   answer:'2 for every 1'},
  {q:'A recipe needs flour and sugar in ratio 3:1. You use 6 cups of flour. How many cups of sugar?',
   opts:['6','3','2','1'],
   answer:'2'},
  {q:'What does proportion mean?',
   opts:['A type of shape','Keeping the same ratio when scaling','Adding two numbers','A percentage'],
   answer:'Keeping the same ratio when scaling'},
  {q:'A recipe for 4 people needs 200g flour. How much for 8 people?',
   opts:['100g','200g','300g','400g'],
   answer:'400g'},
];

var NIA=[
  "Priya is baking cookies! Her recipe needs <strong>2 cups of flour</strong> for every <strong>1 cup of sugar</strong>. That is a <em>ratio</em> — a way of comparing two amounts! 🍪",
  "The recipe uses flour, sugar and butter in the ratio <strong>2:1:3</strong>. Use the slider to scale the recipe up — and watch the ratio stay the same! 📐",
  "Now let us check proportions! When we scale a recipe, every ingredient must grow by the <strong>same amount</strong> — that is proportion! 🎯",
  "Quiz time! 🌟 Show what you know about ratio and proportion!",
  "Brilliant! 🏆 You understand ratio and proportion — the maths behind every recipe, map and scale model!"
];
var BTNS=[
  "See the recipe! →",
  "Check proportion! →",
  "Quiz time! →",
  "See the summary! →",
  "🔁 Play Again!"
];
var RENDERS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4];

function dots(s){
  for(var i=0;i<=4;i++){
    var d=document.getElementById('d'+i);
    if(d) d.className='step-dot'+(i<s?' done':i===s?' active':'');
  }
}
function confettiBurst(){
  var c=document.getElementById('confetti');c.innerHTML='';
  var cols=['#ffe066','#c2185b','#2e7d32','#1976d2','#f59e0b','#9c27b0'];
  for(var i=0;i<52;i++){
    var p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[Math.floor(Math.random()*cols.length)]+
      ';width:'+(8+Math.random()*8)+'px;height:'+(8+Math.random()*8)+'px;'+
      'border-radius:'+(Math.random()>.5?'50%':'2px')+';'+
      'animation-delay:'+(Math.random()*.6)+'s;animation-duration:'+(1.5+Math.random())+'s';
    c.appendChild(p);
  }
  setTimeout(function(){c.innerHTML='';},3000);
}

// ── STEP 0 — Preface ──────────────────────────────────────
function renderStep0(){
  var examples=[
    {icon:'🍪',text:'Recipe: 2 cups flour for every 1 cup sugar'},
    {icon:'🗺️',text:'Map: 1 cm represents 10 km in real life'},
    {icon:'🚗',text:'Speed: 60 km for every 1 hour'},
    {icon:'🎨',text:'Paint: 3 parts blue to 1 part white = sky blue'},
    {icon:'💰',text:'Exchange: £1 = $1.27 (ratio of currencies)'},
  ];
  var exHtml=examples.map(function(e){
    return '<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.85);'+
      'border:2px solid #f48fb1;border-radius:12px;padding:8px 12px;flex:1;min-width:140px">'+
      '<span style="font-size:22px">'+e.icon+'</span>'+
      '<span style="font-family:Fredoka One,cursive;font-size:clamp(11px,2.5vw,14px);color:#880e4f">'+e.text+'</span></div>';
  }).join('');
  document.getElementById('mainArea').innerHTML=
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">📘</div><div><strong>What you will learn:</strong> What ratio means (comparing two amounts), what proportion means (keeping the ratio the same when scaling), and how to use both.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🌍</div><div><strong>Why it matters:</strong> Ratio and proportion are everywhere — recipes, maps, scale models, exchange rates, mixing paint. They describe how things relate to each other.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🎯</div><div><strong>By the end:</strong> You will understand ratio notation (2:1), be able to scale a recipe up or down, and check whether two things are in proportion!</div></div>'+
    '</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(13px,3vw,15px);color:#880e4f;text-align:center;margin-bottom:10px">Ratios are everywhere!</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+exHtml+'</div>';
}

// ── STEP 1 — Recipe scaler ─────────────────────────────────
function renderStep1(){
  batchCount=1;
  // Build static shell
  var total=RECIPE.ratio[0]+RECIPE.ratio[1]+RECIPE.ratio[2];
  var barSegs=RECIPE.ings.map(function(ing,i){
    var pct=Math.round((RECIPE.ratio[i]/total)*100);
    return '<div class="ratio-seg" id="rseg'+i+'" style="width:'+pct+'%;background:'+ing.color+'">'+
      RECIPE.ratio[i]+' '+ing.name+'</div>';
  }).join('');

  var ingRows=RECIPE.ings.map(function(ing,i){
    return '<div class="ing-row">'+
      '<span class="ing-emoji">'+ing.emoji+'</span>'+
      '<div class="ing-bar-wrap">'+
      '<div class="ing-bar" id="ibar'+i+'" style="background:'+ing.color+';width:100%">'+
        '<span id="iamt'+i+'">'+RECIPE.ratio[i]+'</span> '+ing.unit+'</div>'+
      '</div>'+
      '<div class="ing-label" id="ilbl'+i+'">×1</div>'+
      '</div>';
  }).join('');

  document.getElementById('mainArea').innerHTML=
    '<div class="recipe-scene">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,18px);color:#880e4f;text-align:center;margin-bottom:8px">🍪 '+RECIPE.name+' — ratio '+RECIPE.description+'</div>'+
    '<div class="ratio-bar" id="ratioBar">'+barSegs+'</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:12px;color:#c2185b;text-align:center;margin-bottom:10px">The ratio bar always stays the same shape — even as quantities change!</div>'+
    ingRows+
    '</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,17px);color:#880e4f;text-align:center;margin-bottom:6px">How many batches? <span id="batchLbl">1 batch = '+RECIPE.makes+' cookies</span></div>'+
    '<input type="range" min="1" max="6" value="1" id="batchSlider" style="margin-bottom:8px">'+
    '<div style="display:flex;justify-content:space-between;font-family:Fredoka One,cursive;font-size:11px;color:#c2185b;padding:0 2px;margin-bottom:8px">'+
    '<span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span>'+
    '</div>'+
    '<div id="cookieCount" style="text-align:center;font-family:Fredoka One,cursive;font-size:clamp(16px,4vw,22px);color:#880e4f">'+
    '🍪 × 12 cookies'+
    '</div>';

  // Wire slider — never rebuild, only update values
  var sl=document.getElementById('batchSlider');
  if(sl) sl.addEventListener('input',function(){updateRecipe(parseInt(this.value));});
  updateRecipe(1);
}

function updateRecipe(n){
  batchCount=n;
  var maxAmount=RECIPE.ratio[2]*6; // max tbsp for normalising bar widths
  RECIPE.ings.forEach(function(ing,i){
    var amt=RECIPE.ratio[i]*n;
    var maxVal=RECIPE.ratio[i]*6;
    var barPct=Math.round((amt/maxVal)*100);
    var amtEl=document.getElementById('iamt'+i);
    if(amtEl) amtEl.textContent=amt;
    var barEl=document.getElementById('ibar'+i);
    if(barEl) barEl.style.width=Math.max(20,barPct)+'%';
    var lblEl=document.getElementById('ilbl'+i);
    if(lblEl) lblEl.textContent='×'+n;
  });
  var lbl=document.getElementById('batchLbl');
  if(lbl) lbl.textContent=n+' batch'+(n>1?'es':'')+' = '+(RECIPE.makes*n)+' cookies';
  var cc=document.getElementById('cookieCount');
  if(cc) cc.textContent='🍪 × '+(RECIPE.makes*n)+' cookies';
  var sl=document.getElementById('batchSlider');
  if(sl) sl.value=n;
  var nia=document.getElementById('nia');
  if(nia){
    var amts=RECIPE.ings.map(function(ing,i){return (RECIPE.ratio[i]*n)+' '+ing.unit+' '+ing.name;});
    nia.innerHTML=n+' batch'+(n>1?'es':'')+': <strong>'+amts.join(' + ')+'</strong>. The ratio is still <em>'+RECIPE.description+'</em> — scaled up '+n+'×!';
  }
}

// ── STEP 2 — Proportion checker ───────────────────────────
var propA1=2, propA2=4, propB1=1, propB2=2;

function renderStep2(){
  propA1=2;propA2=4;propB1=1;propB2=2;
  buildPropChecker();
}

function buildPropChecker(){
  var ratio1=propA1+':'+propB1;
  var ratio2=propA2+':'+propB2;
  // Check if in proportion
  var inProp=(propA1*propB2===propA2*propB1);
  // Visualise as bars
  var maxVal=Math.max(propA1,propA2,propB1,propB2,1);
  var bar=(function(val,col,label){
    var pct=Math.round((val/maxVal)*100);
    return '<div style="margin-bottom:8px">'+
      '<div style="font-family:Fredoka One,cursive;font-size:13px;color:#880e4f;margin-bottom:3px">'+label+': '+val+'</div>'+
      '<div style="height:32px;border-radius:8px;background:'+col+';width:'+Math.max(8,pct)+'%;'+
      'transition:width .3s;display:flex;align-items:center;padding-left:8px;'+
      'font-family:Fredoka One,cursive;font-size:14px;color:#fff;min-width:40px">'+val+'</div></div>';
  });

  var propHtml=
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(14px,3vw,17px);color:#880e4f;text-align:center;margin-bottom:10px">'+
    'Are these two mixtures in proportion? 🎨</div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:12px">'+
    // Mixture 1
    '<div style="flex:1;min-width:140px;background:rgba(255,255,255,.85);border:2.5px solid #f48fb1;border-radius:14px;padding:12px">'+
    '<div style="font-family:Fredoka One,cursive;font-size:15px;color:#c2185b;text-align:center;margin-bottom:8px">Mixture 1: <span style="color:#880e4f">'+ratio1+'</span></div>'+
    bar(propA1,'#c2185b','🔴 Red paint')+
    bar(propB1,'#1976d2','🔵 Blue paint')+
    '<div style="display:flex;gap:6px;justify-content:center;margin-top:6px">'+
    '<button onclick="changeVal(1,1,1)" style="padding:4px 10px;border-radius:8px;border:2px solid #f48fb1;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#880e4f">+</button>'+
    '<button onclick="changeVal(1,1,-1)" style="padding:4px 10px;border-radius:8px;border:2px solid #f48fb1;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#880e4f">−</button>'+
    '<span style="font-family:Fredoka One,cursive;font-size:12px;color:#888;align-self:center">Red</span>'+
    '<button onclick="changeVal(1,2,1)" style="padding:4px 10px;border-radius:8px;border:2px solid #81d4fa;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#1976d2">+</button>'+
    '<button onclick="changeVal(1,2,-1)" style="padding:4px 10px;border-radius:8px;border:2px solid #81d4fa;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#1976d2">−</button>'+
    '<span style="font-family:Fredoka One,cursive;font-size:12px;color:#888;align-self:center">Blue</span>'+
    '</div></div>'+
    // Mixture 2
    '<div style="flex:1;min-width:140px;background:rgba(255,255,255,.85);border:2.5px solid #f48fb1;border-radius:14px;padding:12px">'+
    '<div style="font-family:Fredoka One,cursive;font-size:15px;color:#c2185b;text-align:center;margin-bottom:8px">Mixture 2: <span style="color:#880e4f">'+ratio2+'</span></div>'+
    bar(propA2,'#c2185b','🔴 Red paint')+
    bar(propB2,'#1976d2','🔵 Blue paint')+
    '<div style="display:flex;gap:6px;justify-content:center;margin-top:6px">'+
    '<button onclick="changeVal(2,1,1)" style="padding:4px 10px;border-radius:8px;border:2px solid #f48fb1;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#880e4f">+</button>'+
    '<button onclick="changeVal(2,1,-1)" style="padding:4px 10px;border-radius:8px;border:2px solid #f48fb1;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#880e4f">−</button>'+
    '<span style="font-family:Fredoka One,cursive;font-size:12px;color:#888;align-self:center">Red</span>'+
    '<button onclick="changeVal(2,2,1)" style="padding:4px 10px;border-radius:8px;border:2px solid #81d4fa;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#1976d2">+</button>'+
    '<button onclick="changeVal(2,2,-1)" style="padding:4px 10px;border-radius:8px;border:2px solid #81d4fa;background:#fff;font-family:Fredoka One,cursive;font-size:16px;cursor:pointer;color:#1976d2">−</button>'+
    '<span style="font-family:Fredoka One,cursive;font-size:12px;color:#888;align-self:center">Blue</span>'+
    '</div></div>'+
    '</div>'+
    '<div style="text-align:center;padding:12px 16px;border-radius:14px;'+
    'background:'+(inProp?'rgba(67,160,71,.1)':'rgba(229,57,53,.07)')+';'+
    'border:2.5px solid '+(inProp?'#43a047':'#e53935')+';font-family:Fredoka One,cursive;'+
    'font-size:clamp(15px,3.5vw,20px);color:'+(inProp?'#2e7d32':'#c62828')+'">'+
    (inProp?'✅ In proportion! '+ratio1+' and '+ratio2+' have the same ratio!':
     '❌ Not in proportion — '+ratio1+' and '+ratio2+' give different colours!')+
    '</div>';

  document.getElementById('mainArea').innerHTML='<div class="prop-check">'+propHtml+'</div>';

  var nia=document.getElementById('nia');
  if(nia){
    nia.innerHTML=inProp?
      'Both mixtures are <strong>in proportion</strong>! '+ratio1+' and '+ratio2+' give exactly the same colour — because the ratio of red to blue is the same!':
      'The mixtures are <strong>not in proportion</strong>! '+ratio1+' and '+ratio2+' give different shades — the ratio of red to blue is different!';
  }
}

function changeVal(mix,col,delta){
  if(mix===1&&col===1){propA1=Math.max(1,propA1+delta);}
  else if(mix===1&&col===2){propB1=Math.max(1,propB1+delta);}
  else if(mix===2&&col===1){propA2=Math.max(1,propA2+delta);}
  else if(mix===2&&col===2){propB2=Math.max(1,propB2+delta);}
  buildPropChecker();
}

// ── STEP 3 — Quiz ─────────────────────────────────────────
function renderStep3(){
  quizIdx=0;quizCorrect=0;
  document.getElementById('nia').innerHTML=NIA[3];
  showQuizQ();
}

function showQuizQ(){
  if(quizIdx>=QUIZ_QS.length){showQuizEnd();return;}
  var q=QUIZ_QS[quizIdx];
  var nia=document.getElementById('nia');
  if(nia) nia.innerHTML='Look at the question carefully — then pick your answer! 🌟';
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var opts='';
  q.opts.forEach(function(o){
    opts+='<button class="quiz-btn" onclick="answerQ(\''+o.replace(/'/g,"\\'")+'\',\''+q.answer.replace(/'/g,"\\'")+'\')">'+o+'</button>';
  });
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div class="quiz-area"><div class="quiz-q">'+q.q+'</div>'+
    '<div class="quiz-options">'+opts+'</div>'+
    '<div class="quiz-result" id="qRes"></div></div>';
}

function answerQ(chosen,correct){
  var btns=document.querySelectorAll('.quiz-btn,.opt,.ans-tile,.ans-row');
  btns.forEach(function(b){b.onclick=null;b.style.cursor='default';if(b.disabled!==undefined)b.disabled=true;});
  var res=document.getElementById('qRes')||document.getElementById('pzRes')||document.getElementById('quizResult');
  if(chosen===correct){

    btns.forEach(function(b){if(b.textContent.trim()===correct)b.className='quiz-btn correct';});
    quizCorrect++;
    if(res){res.textContent='✅ Correct!';res.className='quiz-result correct';}
    document.getElementById('nia').innerHTML='✅ <strong>Correct!</strong> 📐';
  
  } else {

    btns.forEach(function(b){
      if(b.textContent.trim()===chosen)b.className='quiz-btn wrong';
      if(b.textContent.trim()===correct)b.className='quiz-btn correct';
    });
    if(res){res.textContent='❌ The answer is: '+correct;res.className='quiz-result wrong';}
    document.getElementById('nia').innerHTML='💛 The answer is <strong>'+correct+'</strong>!';
  
  }
  quizIdx++;
  var isLast=(quizIdx>=QUIZ_QS.length);
  if(chosen===correct){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQuizEnd():showQuizQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQuizEnd():showQuizQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQuizEnd(){
  var stars='';for(var i=0;i<QUIZ_QS.length;i++)stars+='<div class="star'+(i<quizCorrect?' earned':'')+'" >⭐</div>';
  var msg=quizCorrect===4?'🏆 PERFECT! You are a ratio master!':
          quizCorrect>=3?'🌟 Brilliant!':quizCorrect>=2?'👍 Good work!':'💪 Keep going!';
  document.getElementById('mainArea').innerHTML=
    '<div class="stars">'+stars+'</div>'+
    '<div style="text-align:center;padding:16px;background:linear-gradient(135deg,#fce4ec,#f3e5f5);border-radius:18px;border:2.5px solid #f48fb1">'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#880e4f;margin-bottom:8px">'+msg+'</div>'+
    '<div style="font-size:clamp(14px,3vw,17px);font-weight:700;color:#555">You got <strong style="color:#e53935">'+quizCorrect+'</strong> out of <strong>4</strong> correct!</div></div>';
  if(quizCorrect>=3)confettiBurst();
  document.getElementById('nia').innerHTML=quizCorrect===4?'🏆 <strong>Perfect!</strong> You understand ratio and proportion completely! 📐':'🌟 Well done! A ratio compares amounts — proportion keeps that ratio when scaling!';

  // Start again button
  var sa=document.createElement('button');
  sa.textContent='Start again';
  sa.style.cssText='display:block;margin:16px auto 0;padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)';
  sa.onclick=function(){goStep(-4);};
  var _ep=document.getElementById('mainArea')||document.getElementById('main');
  if(_ep) _ep.appendChild(sa);
}

// ── STEP 4 — Summary ──────────────────────────────────────
function renderStep4(){
  document.getElementById('mainArea').innerHTML=
    '<div style="text-align:center;padding:8px 0 14px">'+
    '<div style="font-size:56px">🏆</div>'+
    '<div style="font-family:Fredoka One,cursive;font-size:clamp(17px,4vw,24px);color:#880e4f;margin-top:8px;margin-bottom:14px">You understand ratio and proportion!</div>'+
    '</div>'+
    '<div class="preface">'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>A <strong>ratio</strong> compares two amounts. 2:1 means "2 for every 1". Written with a colon between the numbers.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div><strong>Proportion</strong> means keeping the same ratio when you scale up or down. If a recipe doubles, every ingredient doubles.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>To check proportion, use <strong>cross multiplication</strong>: if A:B = C:D then A × D = B × C.</div></div>'+
    '<div class="preface-row"><div class="preface-icon">✅</div><div>Ratios appear in <strong>recipes, maps, scale models, paint mixing, exchange rates</strong> — everywhere things are compared!</div></div>'+
    '<div class="preface-row"><div class="preface-icon">🚀</div><div>Next — we will explore <strong>Basic Algebra</strong>: finding unknown values!</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">'+
    ['2:1 — flour:sugar','3:1 — blue:white paint','1:10 — map scale','1:2 — doubled recipe'].map(function(ex){
      return '<div style="background:#fff;border:2px solid #f48fb1;border-radius:10px;padding:8px 12px;'+
        'font-family:Fredoka One,cursive;font-size:clamp(12px,2.5vw,15px);color:#880e4f">'+ex+'</div>';
    }).join('')+
    '</div>';
  confettiBurst();
}

function goStep(dir){
  currentStep=Math.max(0,Math.min(4,currentStep+dir));
  dots(currentStep);
  document.getElementById('nia').innerHTML=NIA[currentStep];
  document.getElementById('btnBack').disabled=(currentStep===0);
  document.getElementById('btnNext').textContent=BTNS[currentStep];
  document.getElementById('btnNext').disabled=false;
  if(currentStep===4){document.getElementById('btnNext').onclick=function(){goStep(-4);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  RENDERS[currentStep]();
}
goStep(0);
</script>

// ── Option renderer (inline styles) ───────────────────────
var OPT_COLS=['#0891b2','#0369a1','#059669','#b45309'];

function renderOpts(opts,idPfx,clickFn,disMap){
  var allShort=opts.every(function(o){return String(o).length<=6;});
  var html='';
  if(allShort){
    html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0">';
    opts.forEach(function(o,i){
      var dis=disMap?disMap[i]:'';

      if(dis==='correct'){bg='rgba(5,150,105,.12)';bc='#059669';tc='#059669';}

      html+='<button id="'+idPfx+i+'" data-val="'+o+'" '+
        (clickFn&&!dis?'onclick="'+clickFn+'('+i+')"':'')+

        'cursor:'+(dis?'default':'pointer')+';display:flex;align-items:center;justify-content:center;'+
        'font-family:DM Serif Display,serif;font-size:clamp(20px,4vw,28px);color:'+tc+';padding:12px;'+
        'border-left:5px solid '+OPT_COLS[i%OPT_COLS.length]+';'+

    });
    html+='</div>';
  } else {
    html='<div style="display:flex;flex-direction:column;gap:8px;margin:12px 0">';
    opts.forEach(function(o,i){
      var dis=disMap?disMap[i]:'';
      var bg='#ffffff';var bc='#e5e7eb';var tc='#0f1117';var lc=OPT_COLS[i%OPT_COLS.length];
      if(dis==='correct'){bg='rgba(5,150,105,.12)';bc='#059669';tc='#059669';lc='#059669';}
      else if(dis==='wrong'){bg='rgba(220,38,38,.08)';bc='#dc2626';tc='#dc2626';lc='#dc2626';}
      html+='<button id="'+idPfx+i+'" data-val="'+o+'" '+
        (clickFn&&!dis?'onclick="'+clickFn+'('+i+')"':'')+
        ' style="min-height:54px;border-radius:14px;border:1.5px solid '+bc+';background:'+bg+';'+
        'cursor:'+(dis?'default':'pointer')+';display:flex;align-items:center;gap:14px;'+
        'padding:12px 16px;width:100%;box-sizing:border-box;transition:all .2s">'+
        '<div style="width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;'+
        'justify-content:center;font-size:13px;font-weight:700;color:#fff;background:'+lc+'">'+OPT_LBLS[i]+'</div>'+

        '</button>';

    html+='</div>';

function markOpts(idPfx,chosen,correct){
  [0,1,2,3].forEach(function(i){
    var b=document.getElementById(idPfx+i);if(!b)return;
    var bv=b.getAttribute('data-val');
    var isAns=Array.isArray(correct)?correct.indexOf(bv)>=0:bv===correct;
    b.onclick=null;b.style.cursor='default';
    if(bv===chosen&&isAns){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';b.style.color='#059669';}
    else if(bv===chosen&&!isAns){b.style.background='rgba(220,38,38,.08)';b.style.borderColor='#dc2626';b.style.color='#dc2626';}
    else if(isAns){b.style.background='rgba(5,150,105,.12)';b.style.borderColor='#059669';}
  });
}

// ── SVG shapes ────────────────────────────────────────────

    '<text x="'+(sw/2)+'" y="'+(py-4)+'" text-anchor="middle" font-size="11" fill="'+fill+'" font-family="DM Sans,sans-serif">'+w+'</text>'+
    '<text x="'+(px-4)+'" y="'+(sh/2+4)+'" text-anchor="end" font-size="11" fill="'+fill+'" font-family="DM Sans,sans-serif">'+h+'</text>'+

}

// Improved isometric unit cube grid
function unitCubesHTML(l,w,h,showLayers){
  var cw=36,ch=20,cd=18;
  var PAD=20;
  var W=l*cw+w*(cd>>1)+PAD*2+20;
  var H=w*(cd>>1)+h*ch+PAD*2+20;
  var TOP='#93c5fd',FRONT='#2563eb',SIDE='#1e3a8a';
  var ox=PAD+w*(cd>>1), oy=H-PAD;
  function face(cx,cy,cz){
    var sx=ox+cx*cw+cy*(cd>>1);
    var sy=oy-cz*ch-cy*(cd>>1);
    var t=[[sx,sy-ch],[sx+cw,sy-ch],[sx+cw+(cd>>1),sy-ch-(cd>>1)],[sx+(cd>>1),sy-ch-(cd>>1)]];
    var f=[[sx,sy-ch],[sx+cw,sy-ch],[sx+cw,sy],[sx,sy]];
    var r=[[sx+cw,sy-ch],[sx+cw+(cd>>1),sy-ch-(cd>>1)],[sx+cw+(cd>>1),sy-(cd>>1)],[sx+cw,sy]];
    return {t:t,f:f,r:r};
  }
  function pts(c){return c.map(function(p){return Math.round(p[0])+','+Math.round(p[1]);}).join(' ');}
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+(W+20)+'px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">';
  for(var layer=0;layer<Math.min(showLayers,h);layer++){
    for(var dep=w-1;dep>=0;dep--){
      for(var col=0;col<l;col++){
        var fc=face(col,dep,layer);
        s+='<polygon points="'+pts(fc.t)+'" fill="'+TOP+'" stroke="white" stroke-width="1.5"/>';
        s+='<polygon points="'+pts(fc.f)+'" fill="'+FRONT+'" stroke="white" stroke-width="1.5"/>';
        s+='<polygon points="'+pts(fc.r)+'" fill="'+SIDE+'" stroke="white" stroke-width="1.5"/>';
      }
    }
  }
  var lc='#1e40af';
  s+='<text x="'+(ox+l*cw/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="12" fill="'+lc+'" font-family="DM Sans,sans-serif" font-weight="700">'+l+' wide</text>';
  s+='<text x="'+(ox-12)+'" y="'+(oy-Math.min(showLayers,h)*ch/2)+'" text-anchor="end" font-size="12" fill="'+lc+'" font-family="DM Sans,sans-serif" font-weight="700">Layer '+Math.min(showLayers,h)+' of '+h+'</text>';
  s+='</svg>';
  return s;
}

        '<div style="background:rgba(5,150,105,.05);border:1.5px solid rgba(79,70,229,.2);border-radius:12px;padding:14px;margin-top:10px">'+
          '<div style="display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px">'+
            '<span style="background:#fee2e2;border-radius:8px;padding:4px 10px;font-family:DM Serif Display,serif;font-size:18px;color:#dc2626">a&#178; = 9</span>'+
            '<span style="font-size:18px;color:var(--muted)">+</span>'+
            '<span style="background:#dbeafe;border-radius:8px;padding:4px 10px;font-family:DM Serif Display,serif;font-size:18px;color:#1d4ed8">b&#178; = 16</span>'+
            '<span style="font-size:18px;color:var(--muted)">=</span>'+
            '<span style="background:#dcfce7;border-radius:8px;padding:4px 10px;font-family:DM Serif Display,serif;font-size:18px;color:#059669">c&#178; = 25</span>'+
          '</div>'+
          '<div style="font-size:13px;color:var(--ink2);text-align:center">The two smaller squares together always equal the square on the hypotenuse.</div>'+
        '</div></div>',
      nia:'Each side of the triangle forms a square. The <strong style="color:#dc2626">red square</strong> (a²=9) plus the <strong style="color:#1d4ed8">blue square</strong> (b²=16) exactly equals the <strong style="color:#059669">green square</strong> (c²=25). Always.'
    },
    // Finding hypotenuse
    {
      html:'<div style="animation:fi .3s ease">'+
        '<div class="panel-title">Finding the hypotenuse</div>'+
        '<div style="text-align:center;margin-bottom:12px">'+
          '<svg viewBox="0 0 200 160" width="180" height="140" xmlns="http://www.w3.org/2000/svg">'+
          '<polygon points="20,140 140,140 20,20" fill="rgba(8,145,178,.08)" stroke="#0891b2" stroke-width="2"/>'+
          '<rect x="20" y="120" width="20" height="20" fill="none" stroke="#0891b2" stroke-width="1.5"/>'+
          '<text x="14" y="85" text-anchor="end" font-size="13" fill="#dc2626" font-family="DM Serif Display,serif">a=3</text>'+
          '<text x="82" y="155" text-anchor="middle" font-size="13" fill="#0369a1" font-family="DM Serif Display,serif">b=4</text>'+
          '<text x="100" y="80" text-anchor="middle" font-size="13" fill="#059669" font-family="DM Serif Display,serif">c=?</text>'+
          '</svg>'+
        '</div>'+
        '<div style="background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:14px">'+
          '<div class="s-row"><div class="s-num">1</div><div>a² + b² = c² &nbsp;&rarr;&nbsp; 3² + 4² = c²</div></div>'+
          '<div class="s-row"><div class="s-num">2</div><div>9 + 16 = c²</div></div>'+
          '<div class="s-row"><div class="s-num">3</div><div>c² = 25 &nbsp;&rarr;&nbsp; c = &#8730;25 = <strong style="color:var(--green)">5cm</strong></div></div>'+
        '</div>'+
        '<div style="background:rgba(5,150,105,.06);border:1px solid rgba(79,70,229,.2);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;color:var(--ink2)">'+
          'The 3-4-5 triangle is the most famous right triangle. Builders have used it for thousands of years to make square corners.'+
        '</div></div>',
      nia:'The 3-4-5 triangle: <strong>9 + 16 = 25</strong>. Square root of 25 = 5. The hypotenuse is always opposite the right angle — the longest side.'
    },
    // Finding a shorter side
    {
      html:'<div style="animation:fi .3s ease">'+
        '<div class="panel-title">Finding a shorter side</div>'+
        '<div style="background:rgba(3,105,161,.05);border:1.5px solid rgba(79,70,229,.2);border-radius:14px;padding:14px;margin-bottom:12px;text-align:center">'+
          '<div class="formula">a&#178; = c&#178; &#8722; b&#178;</div>'+
          '<div style="font-size:13px;color:var(--ink2);margin-top:4px">Rearrange: subtract the known side&#178; from the hypotenuse&#178;</div>'+
        '</div>'+
        '<div style="background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:8px">'+
          '<div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px">Example: hypotenuse = 13cm, one side = 5cm</div>'+
          '<div class="s-row"><div class="s-num">1</div><div>a² = 13² - 5² = 169 - 25 = 144</div></div>'+
          '<div class="s-row"><div class="s-num">2</div><div>a = &#8730;144 = <strong style="color:#0369a1">12cm</strong></div></div>'+
        '</div>'+
        '<div style="background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:12px;font-size:13px;color:var(--ink2)">'+
          '<strong style="color:var(--ink)">Second example:</strong> hypotenuse 10, one side 6: a² = 100 - 36 = 64. a = <strong style="color:#0369a1">8cm</strong>'+
        '</div></div>',
      nia:'Pythagoras works in <strong>both directions</strong>. To find a shorter side: a² = c² - b². Subtract the known side squared from the hypotenuse squared.'
    },
  ];
  function show(){
    var sdots=S.map(function(_,i){return '<div class="sdot'+(i===sl?' on':'')+'"></div>';}).join('');
    document.getElementById('main').innerHTML='<div class="panel">'+S[sl].html+
      '<div class="slide-nav">'+sdots+'</div>'+
      '<div class="snav">'+
        '<button class="sbtn prev" onclick="s3b()" '+(sl===0?'disabled':'')+'>&#8592; Back</button>'+
        '<button class="sbtn nxt" onclick="s3n()">'+(sl<S.length-1?'Next &#8594;':'Practice &#8594;')+'</button>'+
      '</div></div>';
    document.getElementById('nia').innerHTML=S[sl].nia;
    var bb=document.getElementById('btnBack');
    if(bb){bb.disabled=false;bb.onclick=function(){if(sl>0){sl--;show();}else{goStep(-1);}};}
  }
  window.s3n=function(){if(sl<S.length-1){sl++;show();}else{goStep(1);}};
  window.s3b=function(){if(sl>0){sl--;show();}else{goStep(-1);}};
  show();
}

// ── STEP 4: Puzzles ───────────────────────────────────────
function renderStep4(){puzzleLevel=0;puzzleScore=0;puzzleResults=[];levelAnswered=false;showPuzzle();}

function showPuzzle(){
  if(puzzleLevel>=PUZZLES.length){showPuzzleDone();return;}
  var pz=PUZZLES[puzzleLevel];levelAnswered=false;
  var pips='';for(var i=0;i<PUZZLES.length;i++)pips+='<div class="prog-pip'+(i<puzzleLevel?' dp':i===puzzleLevel?' cp':'')+'" ></div>';
  var qDisplay=pz.q.replace(/\n/g,'<br>');
  document.getElementById('main').innerHTML=
    '<div class="panel">'+
    '<div class="prog-row"><span class="prog-label">Puzzle '+(puzzleLevel+1)+' of '+PUZZLES.length+'</span><div class="prog-pips">'+pips+'</div></div>'+
    '<div class="puz-q">'+qDisplay+'</div>'+
    renderOpts(pz.opts,'popt','pickPuz',null)+
    '<div class="res" id="pzRes"></div></div>';
  document.getElementById('nia').innerHTML='Apply the formula. Pick your answer.';
  var bb=document.getElementById('btnBack');
  if(bb){bb.disabled=false;bb.onclick=function(){
    if(puzzleLevel>0){puzzleLevel--;if(puzzleResults[puzzleLevel]===true){puzzleScore--;puzzleResults[puzzleLevel]=undefined;}levelAnswered=false;showPuzzle();}
    else{goStep(-1);}
  };}
}

function pickPuz(idx){
  if(levelAnswered)return;levelAnswered=true;
  var pz=PUZZLES[puzzleLevel];
  var chosen=document.getElementById('popt'+idx)?document.getElementById('popt'+idx).getAttribute('data-val'):'';
  var ok=(chosen===pz.ans);
  puzzleResults[puzzleLevel]=ok;
  markOpts('popt',chosen,pz.ans);
  var res=document.getElementById('pzRes');
  if(ok){puzzleScore++;if(res){res.textContent='Correct. '+pz.explain;res.className='res ok';}document.getElementById('nia').innerHTML='Correct. '+pz.explain;}
  else{if(res){res.textContent='Not quite. '+pz.explain;res.className='res no';}document.getElementById('nia').innerHTML=pz.explain;}
  puzzleLevel++;
  var isLast=(puzzleLevel>=PUZZLES.length);
  if(ok){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showPuzzleDone():showPuzzle();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showPuzzleDone():showPuzzle();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showPuzzleDone(){
  var perfect=(puzzleScore>=PUZZLES.length);
  if(perfect)burst();
  var bb=document.getElementById('btnBack');
  if(bb){bb.disabled=false;bb.onclick=function(){
    puzzleLevel=PUZZLES.length-1;
    if(puzzleResults[puzzleLevel]===true){puzzleScore--;puzzleResults[puzzleLevel]=undefined;}
    levelAnswered=false;showPuzzle();
  };}
  document.getElementById('main').innerHTML=
    '<div class="panel" style="text-align:center;padding:32px 24px">'+
    '<div style="font-size:48px;margin-bottom:14px">'+(perfect?'&#127919;':'&#128077;')+'</div>'+
    '<div style="font-family:DM Serif Display,serif;font-size:clamp(22px,5vw,28px);margin-bottom:8px">'+
      (perfect?'All four puzzles correct!':'Practice complete \u2014 '+puzzleScore+' of '+PUZZLES.length+' correct.')+
    '</div>'+
    (perfect?'':'<p style="font-size:14px;color:var(--muted)">Tap &#8592; to retry any puzzle.</p>')+
    '</div>';
  document.getElementById('nia').innerHTML=perfect?'All four correct. Ready for the quiz.':'Good effort. Use &#8592; to review before the quiz.';
}

// ── STEP 5: Quiz ──────────────────────────────────────────
function renderStep5(){qIdx=0;qScore=0;qHistory=[];document.getElementById('nia').innerHTML='Four questions. Think carefully.';showQ();}

function showQ(){
  if(qIdx>=QS.length){showQEnd();return;}
  var q=QS[qIdx];
  var nia=document.getElementById('nia');if(nia)nia.innerHTML='Pick your answer.';
  var stars='';for(var i=0;i<QS.length;i++)stars+='<div class="star'+(i<qScore?' on':'')+'">&#11088;</div>';
  document.getElementById('main').innerHTML=
    '<div class="panel"><div class="stars">'+stars+'</div>'+
    '<div class="puz-q">'+q.q+'</div>'+
    renderOpts(q.opts,'qopt','pickQ',null)+
    '<div class="res" id="qRes"></div></div>';
  var bb=document.getElementById('btnBack');
  if(bb){bb.disabled=false;bb.onclick=function(){if(qIdx>0&&qHistory.length>0){showQPrev(qIdx-1);}else{goStep(-1);};};}
}

function showQPrev(idx){
  if(idx<0||!qHistory[idx])return;
  var q=QS[idx];var h=qHistory[idx];
  var stars='';for(var i=0;i<QS.length;i++)stars+='<div class="star'+(i<h.score?' on':'')+'">&#11088;</div>';
  var disMap={};
  q.opts.forEach(function(o,i){
    if(o===h.chosen&&h.wasCorrect)disMap[i]='correct';
    else if(o===h.chosen&&!h.wasCorrect)disMap[i]='wrong';
    else if(o===h.correct&&!h.wasCorrect)disMap[i]='correct';
    else disMap[i]='';
  });
  document.getElementById('main').innerHTML=
    '<div class="panel"><div class="stars">'+stars+'</div>'+
    '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:8px">Question '+(idx+1)+' \u2014 reviewed</div>'+
    '<div class="puz-q">'+q.q+'</div>'+
    renderOpts(q.opts,'qopt',null,disMap)+
    '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'+
    '<button onclick="showQPrev('+(idx-1)+')" style="padding:8px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);opacity:'+(idx===0?.3:1)+'" '+(idx===0?'disabled':'')+'>&#8592; Prev</button>'+
    (idx<qIdx-1?'<button onclick="showQPrev('+(idx+1)+')" style="padding:8px 16px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)">Next &#8594;</button>':
     '<button onclick="showQ()" style="padding:8px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer">Continue quiz &#8594;</button>')+
    '</div></div>';
  document.getElementById('nia').innerHTML=(h.wasCorrect?'Correct! ':'Answer was <strong>'+h.correct+'</strong>. ')+'Reviewing question '+(idx+1)+'.';
}

function pickQ(idx){
  var q=QS[qIdx];
  [0,1,2,3].forEach(function(i){var b=document.getElementById('qopt'+i);if(b){b.onclick=null;b.style.cursor='default';}});
  var chosen=document.getElementById('qopt'+idx)?document.getElementById('qopt'+idx).getAttribute('data-val'):'';
  var ok=(chosen===q.ans);
  qHistory[qIdx]={chosen:chosen,correct:q.ans,wasCorrect:ok,score:qScore+(ok?1:0)};
  markOpts('qopt',chosen,q.ans);
  var res=document.getElementById('qRes');
  if(ok){qScore++;if(res){res.textContent='Correct.';res.className='res ok';}document.getElementById('nia').innerHTML='Correct.';}
  else{if(res){res.textContent='Answer: '+q.ans;res.className='res no';}document.getElementById('nia').innerHTML='Answer: <strong>'+q.ans+'</strong>.';}
  qIdx++;
  var isLast=(qIdx>=QS.length);
  if(ok){
    var _adv=false;
    function _doAdv(){if(_adv)return;_adv=true;isLast?showQEnd():showQ();}
    var _t=setTimeout(_doAdv,1500);
    var nxt=document.createElement('button');
    nxt.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt.onclick=function(){clearTimeout(_t);_doAdv();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt);
  } else {
    var nxt2=document.createElement('button');
    nxt2.textContent=isLast?'See results \u2192':'Next \u2192';
    nxt2.style.cssText='display:block;margin:14px auto 0;padding:10px 28px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)';
    nxt2.onclick=function(){isLast?showQEnd():showQ();};
    if(res&&res.parentNode)res.parentNode.appendChild(nxt2);
  }
}

function showQEnd(){
  var perfect=(qScore===QS.length);if(perfect)burst();
  var stars='';for(var i=0;i<QS.length;i++)stars+='<div class="star'+(i<qScore?' on':'')+'">&#11088;</div>';
  document.getElementById('main').innerHTML=
    '<div class="panel" style="text-align:center;padding:32px 24px">'+
    '<div class="stars" style="margin-bottom:20px">'+stars+'</div>'+
    '<div style="font-family:DM Serif Display,serif;font-size:clamp(22px,5vw,28px);margin-bottom:8px">'+
      (perfect?'Perfect.':qScore>=3?'Almost perfect.':qScore>=2?'Good work.':'Keep going.')+
    '</div>'+
    '<div style="font-size:14px;color:var(--muted);margin-bottom:20px">'+qScore+' of '+QS.length+' correct</div>'+
    '<button onclick="goStep(-5)" style="padding:10px 28px;border-radius:10px;border:1.5px solid var(--rule);background:var(--bg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)">Start again</button>'+
    '</div>';
  document.getElementById('nia').innerHTML=(perfect?'<strong>Perfect.</strong> ':'')+'Area: l\xd7w, \xbdb\xd7h, \u03c0r\xb2. Volume: l\xd7w\xd7h, \u03c0r\xb2h. Pythagoras: a\xb2+b\xb2=c\xb2.';
}

// ── Summary (step index 5) ─────────────────────────────────
function renderSummary(){
  var rows=[
    {shape:'Rectangle',formula:'A = l \xd7 w',eg:'5\xd74 = 20cm\xb2',col:'#0891b2'},
    {shape:'Triangle',formula:'A = \xbd \xd7 b \xd7 h',eg:'\xbd\xd76\xd74 = 12cm\xb2',col:'#0369a1'},
    {shape:'Circle',formula:'A = \u03c0 \xd7 r\xb2',eg:'3.14\xd79 = 28.26cm\xb2',col:'#7c3aed'},
    {shape:'Cuboid',formula:'V = l \xd7 w \xd7 h',eg:'3\xd74\xd75 = 60cm\xb3',col:'#059669'},
    {shape:'Cylinder',formula:'V = \u03c0 \xd7 r\xb2 \xd7 h',eg:'3.14\xd74\xd710 = 125.6cm\xb3',col:'#0891b2'},
    {shape:'Pythagoras',formula:'a\xb2 + b\xb2 = c\xb2',eg:'3\xb2+4\xb2=25 \u2192 c=5cm',col:'#059669'},
  ].map(function(r){
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)">'+
      '<div style="width:8px;height:8px;border-radius:50%;background:'+r.col+';flex-shrink:0"></div>'+
      '<div style="flex:1;font-size:12px;font-weight:700;color:var(--ink)">'+r.shape+'</div>'+
      '<div style="font-family:DM Serif Display,serif;font-size:15px;color:'+r.col+';flex:1">'+r.formula+'</div>'+
      '<div style="font-size:12px;color:var(--muted);flex:1">'+r.eg+'</div>'+
      '</div>';
  }).join('');
  document.getElementById('main').innerHTML=
    '<div class="panel">'+
    '<div class="panel-title">Six formulas</div>'+rows+
    '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2);font-weight:500">'+
      'Next: <strong style="color:var(--ink)">Ages 11\u201313</strong> \u2014 ratio, proportion and algebraic graphs.'+
    '</div></div>';
}

// ── Step rendering map ────────────────────────────────────
var RS=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4,renderStep5,renderSummary];

function goStep(dir){
  step=Math.max(0,Math.min(6,step+dir));
  var dotStep=Math.min(step,4);
  for(var i=0;i<=4;i++){var d=document.getElementById('d'+i);if(d)d.className='step-dot'+(i<dotStep?' done':i===dotStep?' active':'');}
  var niaArr=[
    'Three powerful tools: <strong>Area</strong> measures flat space, <strong>Volume</strong> measures 3D space, and <strong>Pythagoras</strong> unlocks the right angle.',
    'Area — counting the squares inside a shape.',
    'Volume — stacking layers of area.',
    'Pythagoras — the relationship between sides of every right-angled triangle.',
    'Four puzzles. Apply the formulas.',
    'Four questions. Think carefully.',
    'Six formulas. One reference.',
  ];
  document.getElementById('nia').innerHTML=niaArr[Math.min(step,niaArr.length-1)];
  document.getElementById('btnBack').disabled=(step===0);
  var bl=['Area','Volume','Pythagoras','Practice','Quiz','Summary','\u21a9 Start again'];
  document.getElementById('btnNext').textContent=(bl[step]||'Next')+' \u2192';
  if(step>=6){document.getElementById('btnNext').onclick=function(){goStep(-6);};}
  else{document.getElementById('btnNext').onclick=function(){goStep(1);};}
  if(step!==4&&step!==5){
    var bb=document.getElementById('btnBack');
    if(bb){bb.disabled=(step===0);bb.onclick=function(){goStep(-1);};}
  }
  RS[Math.min(step,RS.length-1)]();
}
goStep(0);
</script>
